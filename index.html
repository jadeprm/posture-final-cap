<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posture Play · ขยับกาย สบายสมอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful community-centre coach; warm, bright, very readable for older adults
   IDEA: a Thai temple-fair activity board: colourful day cards, a year of dots, a dancing coach figure
   PICTURE: animated coach figure for every move, live mirror camera with skeleton in game
   COLOUR and TYPE: sunshine yellow, coral, sky blue, grape, pink, teal on white; Mitr headings + Sarabun body (Thai + Latin)
   LAYOUT: yellow hero with age picker; today's plan in two parts (stretch then cardio); year ribbon; benefits; game = mirror + coach panel */
:root{color-scheme:light dark;--sun:#FFC83D;--coral:#FF5A5F;--sky:#2F80ED;--grape:#8B5CF6;--pink:#F0468C;--teal:#0EA5B7;--orange:#FF8A1F;
--bg:light-dark(#FFFFFF,#14162B);--ink:light-dark(#1B1F3B,#F2F3FA);--mute:light-dark(#555B7A,#B6BBD6);--soft:light-dark(#FFF6DC,#22254A);--line:light-dark(#E7E9F3,#363A63);--card:light-dark(#FFFFFF,#1C1F3D)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Sarabun,"Noto Sans Thai",system-ui,sans-serif;overflow-x:clip}
body.big{font-size:21px}
h1,h2,h3{font-family:Mitr,Sarabun,sans-serif;font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(36px,6vw,54px)}h2{font-size:clamp(26px,3.4vw,36px)}h3{font-size:21px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(24px,4vw,52px) max(4vw,16px)}
.hide{display:none!important}
button,input{font:inherit;color:inherit}
button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:8px 18px;cursor:pointer;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.primary{background:var(--coral);border-color:var(--coral);color:#fff;font-size:21px;padding:12px 32px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700;color:#fff;background:var(--c,var(--grape));white-space:nowrap}
.chip.soft{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
/* header + hero */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px max(4vw,16px);background:var(--sun);color:#1B1F3B}
.logo{font-family:Mitr,sans-serif;font-size:20px;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--coral) 0 25%,var(--sky) 0 50%,var(--grape) 0 75%,var(--pink) 0)}
.lang{display:flex;gap:6px}.lang button{min-height:44px;background:#fff;border-color:#fff;color:#1B1F3B}.lang button[aria-pressed=true]{background:#1B1F3B;color:#fff;border-color:#1B1F3B}
.hero{background:var(--sun);color:#1B1F3B}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;padding-top:16px}
.hero p{font-size:19px;max-width:56ch;margin:14px 0 0}
.agebox{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 0 rgba(27,31,59,.12)}
.agebox label{display:block;font-weight:700;margin-bottom:8px;color:#1B1F3B}
.agebox input{width:100%;font-size:28px;padding:8px 14px;border-radius:14px;border:2px solid #E7E9F3;background:#fff;color:#1B1F3B}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tier{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:16px;border:3px solid var(--c);background:#fff;color:#1B1F3B;text-align:left;min-height:84px}
.tier b{font-family:Mitr,sans-serif;font-size:20px;color:var(--c)}.tier span{font-size:15px}
.tier[aria-pressed=true]{background:var(--c);color:#fff}.tier[aria-pressed=true] b{color:#fff}
.heroFig{display:flex;gap:8px;margin-top:18px}.heroFig canvas{width:92px;height:110px;background:rgba(255,255,255,.55);border-radius:16px}
/* today */
.dayhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.meta{color:var(--mute);margin:6px 0 0}
.daynav{display:flex;gap:8px;flex-wrap:wrap}
.parts{display:grid;gap:14px;margin-top:22px}
.part{border-radius:24px;padding:16px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:2px solid color-mix(in srgb,var(--c) 35%,transparent)}
.part h3{color:var(--c);margin:2px 4px 10px}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr))}
.mv{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:8px 10px;border-left:8px solid var(--c)}
.mv canvas{width:84px;height:96px;border-radius:12px;background:var(--soft)}
.mv b{display:block;font-size:18px;line-height:1.3}.mv small{display:block;color:var(--mute);font-size:15px}
.mv button{min-height:44px;padding:6px 12px;font-size:15px}
.arrow{text-align:center;color:var(--coral);font-family:Mitr,sans-serif;font-size:26px;line-height:1}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:22px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--soft);cursor:pointer}
.check input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--coral)}
.safety{margin:18px 0 0;padding:14px 18px;border-left:6px solid var(--coral);background:var(--soft);border-radius:0 16px 16px 0;font-size:16px}
.go{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px}
.err{color:#C0392B;font-weight:600}
/* plan */
.plan{background:var(--soft)}
.phasebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:20px 0 10px}
.phasebar div{background:var(--c);color:#fff;border-radius:12px;padding:8px 10px;font-size:15px;line-height:1.3}.phasebar b{display:block;font-family:Mitr,sans-serif;font-weight:500}
.phasebar div.now{outline:4px solid var(--ink);outline-offset:2px}
.year{display:grid;gap:6px;margin-top:8px}
.mrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:center}
.mrow span{font-size:14px;color:var(--mute);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:20px;height:20px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.done{background:var(--c)}.dot.today{box-shadow:0 0 0 3px var(--ink)}.dot.view{transform:scale(1.35)}.dot.easy{border-style:dashed}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
.week div{background:var(--c);color:#fff;border-radius:14px;padding:10px;font-size:15px;line-height:1.3;font-weight:600}
.week small{display:block;opacity:.9;font-weight:400}
/* benefits */
.bens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.ben{background:var(--c);color:#fff;border-radius:22px;padding:18px}.ben h3{margin-bottom:6px}.ben p{margin:0;font-size:16px}
.who{color:var(--mute);margin-top:16px;font-size:16px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,22,43,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet{background:var(--card);border-radius:26px;max-width:960px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:22px}
.mgrid canvas{width:100%;aspect-ratio:5/6;border-radius:20px;background:var(--soft)}
.sheet ol{padding-left:1.3em;margin:8px 0}.sheet li{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.legend{font-size:14px;color:var(--mute);margin-top:8px}
.xbtn{position:absolute;top:12px;right:12px}
/* game */
.game{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:18px;padding:14px max(2vw,12px);max-width:1500px;margin:0 auto;align-items:start}
.stage{position:relative;border-radius:24px;overflow:hidden;background:#0b0f1c;aspect-ratio:16/9}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(20,22,43,.66);padding:20px;gap:8px}
#ovDemo{width:min(34vh,240px);height:min(40vh,280px);background:rgba(255,255,255,.92);border-radius:20px}
.ovbig{font-family:Mitr,sans-serif;font-size:clamp(44px,8vw,100px);line-height:1;color:var(--sun)}
.ovmsg{font-family:Mitr,sans-serif;font-size:clamp(22px,2.8vw,32px);max-width:26ch}
.ovsub{font-size:18px;opacity:.9;max-width:46ch}
.cue{position:absolute;left:50%;top:10%;transform:translateX(-50%);background:rgba(255,255,255,.95);color:#1B1F3B;border-radius:24px;padding:14px 26px;text-align:center;min-width:240px}
.cueword{font-family:Mitr,sans-serif;font-size:clamp(54px,9vw,110px);line-height:1}
.cue canvas{width:150px;height:170px}
.cuerule{font-size:18px;margin-top:8px;max-width:30ch;margin-inline:auto;line-height:1.35}.cuearrows{letter-spacing:.06em;white-space:nowrap}.cuearrows b{color:var(--pink)}
.cuepair{display:flex;gap:26px;justify-content:center;font-family:Mitr,sans-serif;font-size:clamp(44px,8vw,92px);line-height:1.1}.cuepair span{background:#FFF1C9;border-radius:18px;padding:6px 20px;min-width:2.2em}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:rgba(20,22,43,.75);color:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:16px}
.panel{display:flex;flex-direction:column;gap:12px}
.card{border:2px solid var(--line);border-radius:22px;padding:16px;background:var(--card)}
.coach{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:start}
.coach canvas{width:130px;height:150px;border-radius:16px;background:var(--soft)}
.step{font-size:15px;color:var(--mute);font-weight:600}
.count{font-family:Mitr,sans-serif;font-size:clamp(54px,6.5vw,84px);line-height:1;color:var(--c,var(--coral));font-variant-numeric:tabular-nums}
.count small{font-size:.38em;color:var(--mute)}
.count.pulse{animation:pulse .35s ease-out}@keyframes pulse{from{transform:scale(1.12)}to{transform:scale(1)}}
.bar{height:16px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:var(--c,var(--coral));transition:width .25s}
.fb{font-size:20px;font-weight:600;padding:14px 16px;border-radius:16px;background:var(--soft);min-height:62px}
.fb.good{background:#DDF7EA;color:#0B5B3B}.fb.warn{background:#FFE6DA;color:#8A2D0A}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.queue{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.queue li{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:10px;border-left:6px solid var(--c)}
.queue li.now{background:var(--soft);font-weight:700}.queue li.did{opacity:.55;text-decoration:line-through}
/* summary */
.sumtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:22px 0}
.stat{border-radius:22px;padding:16px;background:var(--c);color:#fff}.stat b{display:block;font-family:Mitr,sans-serif;font-size:44px;line-height:1.1}
.stars{font-size:40px;letter-spacing:4px;color:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:980px){.game{grid-template-columns:minmax(0,1fr)}.bens{grid-template-columns:repeat(2,minmax(0,1fr))}.parts{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.phasebar{grid-template-columns:repeat(2,minmax(0,1fr))}.mgrid{grid-template-columns:minmax(0,1fr)}.mgrid canvas{max-width:320px;margin:0 auto}}
@media(max-width:600px){.tiers{grid-template-columns:minmax(0,1fr)}.tier{min-height:0}.bens{grid-template-columns:minmax(0,1fr)}.stage{aspect-ratio:3/4}.mv{grid-template-columns:64px minmax(0,1fr)}.mv canvas{width:64px;height:76px}.mv button{grid-column:1/-1}.coach{grid-template-columns:96px minmax(0,1fr)}.coach canvas{width:96px;height:112px}table{font-size:14px}.mrow{grid-template-columns:minmax(0,1fr)}.dot{width:18px;height:18px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}.count.pulse{animation:none}}
</style>
</head>
<body>
<header class="top"><span class="logo"><i></i><span id="brand">Posture Play</span></span>
 <div class="lang" role="group" aria-label="Language"><button data-lang="th">ไทย</button><button data-lang="en">EN</button></div></header>

<main id="home">
 <section class="hero"><div class="wrap">
  <div><h1 data-t="title"></h1><p data-t="lede"></p><div class="heroFig"><canvas data-pose="t7"></canvas><canvas data-pose="crosscrawl"></canvas><canvas data-pose="t5"></canvas><canvas data-pose="sidereach"></canvas></div></div>
  <div class="agebox"><label for="age" data-t="ageLabel"></label><input id="age" type="number" inputmode="numeric" min="10" max="110"><div class="tiers" id="tiers"></div></div>
 </div></section>

 <section class="wrap" id="today">
  <div class="dayhead">
   <div><span class="chip" id="dayChip"></span> <span class="chip" id="phaseChip"></span> <span class="chip hide" id="easyChip" style="--c:#0EA5B7"></span><h2 id="dayTitle" style="margin-top:10px"></h2><p class="meta" id="dayMeta"></p></div>
   <div class="daynav"><button id="prevDay" data-t="prev"></button><button id="todayBtn" data-t="backToday"></button><button id="nextDay" data-t="next"></button></div>
  </div>
  <div class="parts">
   <div class="part" style="--c:var(--teal)"><h3 data-t="part1"></h3><ol class="moves" id="list1"></ol></div>
   <div class="arrow" aria-hidden="true">▼</div>
   <div class="part" style="--c:var(--coral)"><h3 data-t="part2"></h3><ol class="moves" id="list2"></ol></div>
  </div>
  <div class="setup">
   <label class="check"><input type="checkbox" id="c1"><span data-t="c1"></span></label>
   <label class="check"><input type="checkbox" id="c2"><span data-t="c2"></span></label>
   <label class="check"><input type="checkbox" id="c3"><span data-t="c3"></span></label>
  </div>
  <p class="safety" data-th="safety"></p>
  <div class="go"><button class="primary" id="startBtn" data-t="start" disabled></button><span class="meta" id="doneLine"></span></div>
  <p class="err" id="err"></p>
 </section>

 <section class="plan"><div class="wrap">
  <h2 data-t="planTitle"></h2><p class="meta" data-t="planLede"></p>
  <div class="phasebar" id="phaseBar"></div>
  <div class="year" id="year"></div>
  <h3 data-t="weekTitle" style="margin-top:26px"></h3>
  <div class="week" id="week"></div>
  <div class="go"><button id="restartBtn" data-t="restart"></button></div>
 </div></section>

 <section class="wrap">
  <h2 data-t="benefitsTitle"></h2>
  <div class="bens" id="bens"></div>
  <p class="who" data-t="who"></p>
 </section>
</main>

<div class="modal hide" id="modal" role="dialog" aria-modal="true" aria-labelledby="mName"><div class="sheet">
 <button class="xbtn" id="mClose" data-t="close"></button>
 <div class="mgrid"><div><canvas id="mFig"></canvas><p class="legend" data-t="legend"></p></div>
 <div><div class="chips" id="mChips"></div><h2 id="mName"></h2><h3 style="margin-top:14px" data-t="steps"></h3><ol id="mSteps"></ol>
 <h3 data-t="muscles"></h3><div class="chips" id="mMus"></div><h3 data-t="benefit"></h3><p id="mBen"></p></div></div>
</div></div>

<section id="game" class="game hide">
 <div class="stage" id="stage">
  <canvas id="cv"></canvas><video id="vid" playsinline muted class="hide"></video>
  <div class="hud"><span class="pill" id="hudTier"></span><span class="pill" id="hudScore">0</span></div>
  <div class="cue hide" id="cue"></div>
  <div class="overlay" id="ov"><canvas id="ovDemo" class="hide"></canvas><div class="ovbig" id="ovBig"></div><div class="ovmsg" id="ovMsg"></div><div class="ovsub" id="ovSub"></div></div>
 </div>
 <aside class="panel">
  <div class="card coach"><canvas id="demo"></canvas><div><div class="step" id="step"></div><h3 id="exName"></h3><p id="exHow" style="margin:6px 0 0;font-size:16px"></p></div></div>
  <div class="card"><div class="count" id="count">–</div><div class="bar"><i id="barFill"></i></div><div class="chips" id="exMus" style="margin:10px 0 0"></div></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="btns"><button id="pauseBtn" data-t="pause"></button><button id="skipBtn" data-t="skip"></button><button id="soundBtn"></button><button id="endBtn" data-t="end"></button></div>
  <ol class="queue" id="queue"></ol>
 </aside>
</section>

<section id="done" class="wrap hide">
 <h2 id="doneTitle"></h2>
 <div class="sumtop">
  <div class="stat" style="--c:var(--coral)"><span data-t="totalScore"></span><b id="sScore">0</b></div>
  <div class="stat" style="--c:var(--orange)"><span data-t="rating"></span><div class="stars" id="sStars"></div></div>
  <div class="stat" style="--c:var(--sky)"><span data-t="posture"></span><b id="sPosture">–</b></div>
  <div class="stat" style="--c:var(--teal)"><span data-t="goodForm"></span><b id="sForm">–</b></div>
  <div class="stat" style="--c:var(--grape)"><span data-t="reaction"></span><b id="sRt">–</b></div>
 </div>
 <table><thead><tr><th data-t="exercise"></th><th class="n" data-t="doneCol"></th><th class="n" data-t="target"></th><th class="n" data-t="formCol"></th></tr></thead><tbody id="sRows"></tbody></table>
 <h3 style="margin-top:24px" data-t="musclesToday"></h3><div class="chips" id="sMus"></div>
 <h3 style="margin-top:12px" data-t="benefitsToday"></h3><div class="bens" id="sBens"></div>
 <p class="meta" id="sTips"></p>
 <div class="go"><button class="primary" id="againBtn" data-t="again"></button><button id="homeBtn" data-t="home"></button></div>
</section>

<script>/* ===== DATA: i18n, tiers, phases, themes, poses ===== */
const U={
 brand:{th:'Posture Play',en:'Posture Play'},
 title:{th:'ขยับกาย สบายสมอง',en:'Move body, bright mind'},
 lede:{th:'เกมออกกำลังกายผ่านกล้อง แผน 365 วัน ท่าเปลี่ยนทุกวัน เริ่มด้วยการยืดเหยียด ต่อด้วยคาร์ดิโอ รำไทยบนเก้าอี้ และเกมบริหารสมอง',en:'A camera exercise game with a 365-day plan that changes every day. Stretch first, then cardio, Thai dance on a chair and brain games.'},
 ageLabel:{th:'กรอกอายุเพื่อเลือกกลุ่ม',en:'Enter age to pick a group'},
 agePh:{th:'เช่น 62',en:'e.g. 62'},
 dayOf:{th:'วันที่ {d} จาก 365',en:'Day {d} of 365'},
 year:{th:'ปีที่ {y}',en:'Year {y}'},
 todayTag:{th:'วันนี้',en:'Today'},
 phase:{th:'ช่วง',en:'Phase'},
 recovery:{th:'สัปดาห์ผ่อนเบา',en:'Easy week'},
 part1:{th:'ส่วนที่ 1 · ยืดเหยียด',en:'Part 1 · Stretch'},
 part2:{th:'ส่วนที่ 2 · คาร์ดิโอ',en:'Part 2 · Cardio'},
 mins:{th:'ประมาณ {m} นาที',en:'About {m} min'},
 reps:{th:'ครั้ง',en:'reps'}, sec:{th:'วินาที',en:'s'}, trials:{th:'ข้อ',en:'cues'}, rounds:{th:'รอบ',en:'rounds'},
 view:{th:'ดูท่า',en:'See move'},
 start:{th:'เริ่มเล่นด้วยกล้อง',en:'Start with camera'},

/* ---------- annual plan ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const allowed=(p,ti)=>(p.reps[ti]||0)>0;
function dayInfo(d){const phase=Math.min(5,Math.floor(d/61)), easyWeek=Math.floor(d/7)%4===3;
 return {d,phase,easyWeek,theme:THEMES[d%7],mult:PHASES[phase].m*(easyWeek?.8:1)};}
function dayPlan(d,tk){
 const ti=TIERS[tk].i, info=dayInfo(d), r=rng(d*7919+ti*104729+17);
 const used=new Set(), stretch=[], cardio=[];
 const sPool=shuffle(POSES.filter(p=>p.cat==='stretch'&&allowed(p,ti)),r);
 const sN=info.theme.stretchN||3;
 if(info.theme.id==='thai'||info.theme.id==='thaimix'){stretch.push('wrist');used.add('wrist');}
 for(const p of sPool){if(stretch.length>=sN)break;if(!used.has(p.id)){stretch.push(p.id);used.add(p.id);}}
 stretch.sort((a,b)=>(a==='neck'?-1:0)-(b==='neck'?-1:0));
 for(const [g,n] of info.theme.mix){
  const pool=shuffle(POSES.filter(p=>p.grp&&p.grp.includes(g)&&allowed(p,ti)&&!used.has(p.id)),r);
  for(const p of pool.slice(0,n)){cardio.push(p.id);used.add(p.id);}
  for(const fb of ['cardio','thai']){ if(pool.length>=n) break;
   const more=shuffle(POSES.filter(p=>p.grp&&p.grp.includes(fb)&&allowed(p,ti)&&!used.has(p.id)),r).slice(0,n-pool.length);
   for(const p of more){cardio.push(p.id);used.add(p.id);} pool.push(...more); }
 }
 const tgt=(id)=>{const p=POSE[id];let v=p.reps[ti];
  if(p.mode==='memory') return v;
  if(p.mode==='choice') return Math.max(6,Math.round(v*Math.min(info.mult,1.2)));
  v=Math.round(v*info.mult); return p.mode==='hold'?Math.max(8,v):Math.max(4,v);};
 const items=[...stretch.map(id=>({id,block:'stretch',target:tgt(id)})),...cardio.map(id=>({id,block:'cardio',target:tgt(id)}))];
 return {...info,items};
}
function itemSecs(it,tk){const p=POSE[it.id], sl=TIERS[tk].slow;
 if(p.mode==='hold') return it.target+6;
 if(p.mode==='holdreps') return it.target*((p.hold[TIERS[tk].i])+2.5);
 if(p.mode==='follow') return it.target*p.per*sl;
 if(p.mode==='choice') return it.target*4.5;
 if(p.mode==='memory') return it.target*16;
 return it.target*3.5*sl;}
function planMinutes(plan,tk){let s=60;for(const it of plan.items) s+=itemSecs(it,tk)+(it.block==='stretch'?6:TIERS[tk].rest)+4; return Math.round(s/60);}
if(typeof module!=='undefined'&&module.exports) module.exports={POSES,POSE,dayPlan,dayInfo,planMinutes,THEMES,PHASES,TIERS,armState,tposeOk,MOVES,SEAT,STAND};

<script>/* ===== animated stick-figure demo (pseudo-3D, front-left view) ===== */
const FIG=(()=>{
 const D2R=Math.PI/180;
 const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], scl=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
 const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
 const lerp=(a,b,t)=>a+(b-a)*t, lv=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
 function rot(v,s){let [x,y,z]=v,a=(s.twist||0)*D2R,c=Math.cos(a),n=Math.sin(a);[x,z]=[x*c+z*n,-x*n+z*c];
  a=(s.bend||0)*D2R;c=Math.cos(a);n=Math.sin(a);[y,z]=[y*c-z*n,y*n+z*c];
  a=(s.lean||0)*D2R;c=Math.cos(a);n=Math.sin(a);[x,y]=[x*c+y*n,-x*n+y*c];return [x,y,z];}
 function mixL(a,b,t,ks){const o={};for(const k of ks)o[k]=lv(a[k],b[k],t);o.h=t<.5?a.h:b.h;o.f=lerp(a.f||0,b.f||0,t);return o;}
 function specAt(keys,u){const n=keys.length;if(n===1)return keys[0];
  const x=u*n,i=Math.floor(x)%n,j=(i+1)%n;let t=x-Math.floor(x);t=t<.4?0:(t-.4)/.6;t=t*t*(3-2*t);
  const a=keys[i],b=keys[j],o={};for(const k of ['hipY','hz','bend','lean','twist','tilt','shr'])o[k]=lerp(a[k]||0,b[k]||0,t);
  o.aR=mixL(a.aR,b.aR,t,['E','H']);o.aL=mixL(a.aL,b.aL,t,['E','H']);o.lR=mixL(a.lR,b.lR,t,['K','A']);o.lL=mixL(a.lL,b.lL,t,['K','A']);return o;}
 function skel(s){const hc=[0,s.hipY,s.hz||0],neck=add(hc,rot([0,.3,0],s)),head=add(neck,rot([0,.09,0],{bend:s.bend,lean:(s.lean||0)+(s.tilt||0)}));
  const P={hc,neck,head};
  for(const [sd,g] of [['R',-1],['L',1]]){
   const sh=add(hc,rot([g*.1,.28+(s.shr||0),0],s)),a=s['a'+sd];
   const E=rot([a.E[0]*g,a.E[1],a.E[2]],s),H=rot([a.H[0]*g,a.H[1],a.H[2]],s);
   const el=add(sh,scl(nrm(E),.16)),hd=add(el,scl(nrm(sub(H,E)),.15));
   const hj=add(hc,[g*.06,0,0]),l=s['l'+sd],Kv=[l.K[0]*g,l.K[1],l.K[2]],Av=[l.A[0]*g,l.A[1],l.A[2]];
   const kn=add(hj,scl(nrm(Kv),.25)),an=add(kn,scl(nrm(sub(Av,Kv)),.25)),f=l.f||0;
   const toe=add(an,f>=0?lv([0,-.01,.08],[0,-.05,.06],f):lv([0,-.01,.08],[0,.045,.065],-f));
   Object.assign(P,{['sh'+sd]:sh,['el'+sd]:el,['hd'+sd]:hd,['ha'+sd]:a.h,['hj'+sd]:hj,['kn'+sd]:kn,['an'+sd]:an,['to'+sd]:toe});}
  return P;}
 const COL={R:'#FF5A5F',L:'#2F80ED',RL:'#D63F4A',LL:'#1F5FC4',shirt:'#8B5CF6',skin:'#F6C7A1',hair:'#2A2440',gold:'#FFC83D',chair:'#C9B48F',chairD:'#A88F66'};
 function draw(cv,keys,period,time,opt={}){
  const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);

  const pr=p=>{const x=p[0]*cy+p[2]*sy,d=-p[0]*sy+p[2]*cy;return [W/2+x*S-.04*S,H*.95-p[1]*S+d*.16*S,d];};
  // floor shadow
  c.fillStyle='rgba(27,31,59,.10)';c.beginPath();const fc=pr([0,0,.12]);c.ellipse(fc[0],fc[1],.32*S,.06*S,0,0,7);c.fill();
  const seg=(a,b,w,col)=>{const A=pr(a),B=pr(b);return {d:(A[2]+B[2])/2,f:()=>{c.strokeStyle=col;c.lineWidth=w*S;c.lineCap='round';c.beginPath();c.moveTo(A[0],A[1]);c.lineTo(B[0],B[1]);c.stroke();}};};
  const items=[];
  if(opt.chair){const q=(x,y,z)=>pr([x,y,z]);
   items.push({d:-.3,f:()=>{c.fillStyle=COL.chairD;c.strokeStyle=COL.chairD;c.lineWidth=.025*S;c.lineCap='round';
    for(const [x,z] of [[-.15,-.13],[.15,-.13],[-.15,.12],[.15,.12]]){const a=q(x,.25,z),b=q(x,0,z);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}
    for(const x of [-.15,.15]){const a=q(x,.25,-.13),b=q(x,.62,-.15);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}
    const bp=[q(-.15,.44,-.14),q(.15,.44,-.14),q(.15,.6,-.15),q(-.15,.6,-.15)];c.fillStyle=COL.chair;c.beginPath();bp.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();
    const sp=[q(-.16,.25,-.14),q(.16,.25,-.14),q(.16,.25,.13),q(-.16,.25,.13)];c.fillStyle=COL.chair;c.beginPath();sp.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill();}});}
  for(const sd of ['R','L']){
   const far=sd==='L'?.0:0;
   items.push(seg(P['hj'+sd],P['kn'+sd],.062,COL[sd+'L']),seg(P['kn'+sd],P['an'+sd],.052,COL[sd+'L']),seg(P['an'+sd],P['to'+sd],.04,'#2A2440'));
   items.push(seg(P['sh'+sd],P['el'+sd],.048,COL[sd]),seg(P['el'+sd],P['hd'+sd],.042,COL[sd]));
   const hp=pr(P['hd'+sd]),ep=pr(P['el'+sd]),hs=P['ha'+sd];
   items.push({d:hp[2]+.001+far,f:()=>{
    if(hs==='j'){c.fillStyle=COL.gold;c.strokeStyle='#B7791F';c.lineWidth=.008*S;c.beginPath();c.arc(hp[0],hp[1],.026*S,0,7);c.fill();c.stroke();}
    else if(hs==='w'){const ang=Math.atan2(hp[1]-ep[1],hp[0]-ep[0]);c.save();c.translate(hp[0],hp[1]);c.rotate(ang-.9);
     c.fillStyle=COL.skin;c.strokeStyle=COL.gold;c.lineWidth=.012*S;c.beginPath();c.ellipse(.02*S,0,.042*S,.026*S,0,0,7);c.fill();c.stroke();c.restore();}
    else{c.fillStyle=COL.skin;c.beginPath();c.arc(hp[0],hp[1],.023*S,0,7);c.fill();}}});
  }
  const shR=pr(P.shR),shL=pr(P.shL),hjR=pr(P.hjR),hjL=pr(P.hjL),nk=pr(P.neck),hd=pr(P.head);
  items.push({d:Math.min(shR[2],shL[2])-.002,f:()=>{
   c.fillStyle=COL.shirt;c.beginPath();c.moveTo(shR[0],shR[1]);c.lineTo(shL[0],shL[1]);c.lineTo(hjL[0],hjL[1]+.02*S);c.lineTo(hjR[0],hjR[1]+.02*S);c.closePath();c.fill();
   c.strokeStyle=COL.shirt;c.lineJoin='round';c.lineWidth=.05*S;c.stroke();
   c.strokeStyle=COL.skin;c.lineWidth=.04*S;c.lineCap='round';c.beginPath();c.moveTo(nk[0],nk[1]);c.lineTo((nk[0]+hd[0])/2,(nk[1]+hd[1])/2);c.stroke();
   c.fillStyle=COL.skin;c.beginPath();c.arc(hd[0],hd[1],.066*S,0,7);c.fill();
   c.fillStyle=COL.hair;c.beginPath();c.arc(hd[0],hd[1]-.008*S,.068*S,Math.PI*1.05,Math.PI*1.95);c.fill();
   c.fillStyle=COL.hair;c.beginPath();c.arc(hd[0]+.018*S,hd[1]+.005*S,.007*S,0,7);c.arc(hd[0]+.046*S,hd[1]+.002*S,.007*S,0,7);c.fill();}});
  items.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
 }
 return {draw,specAt};
})();

<script type="module">{

/* ---------- geometry / features ---------- */
let AR=16/9;
const deg=r=>r*180/Math.PI, n90=a=>a>90?a-180:a<-90?a+180:a;
function ang(a,b,c){const x1=a.x-b.x,y1=a.y-b.y,x2=c.x-b.x,y2=c.y-b.y;const d=(x1*x2+y1*y2)/((Math.hypot(x1,y1)*Math.hypot(x2,y2))||1e-6);return deg(Math.acos(Math.max(-1,Math.min(1,d))));}
function feats(lm){
 const p=i=>({x:lm[i].x*AR,y:lm[i].y,z:(lm[i].z||0)*AR,v:lm[i].visibility??1});
 const n=p(0),lear=p(7),rear=p(8),ls=p(11),rs=p(12),le=p(13),re=p(14),lw=p(15),rw=p(16),lh=p(23),rh=p(24),lk=p(25),rk=p(26),la=p(27),ra=p(28);
 const sh={x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2},hp={x:(lh.x+rh.x)/2,y:(lh.y+rh.y)/2},sw=Math.hypot(ls.x-rs.x,ls.y-rs.y)||1e-3,T=Math.max(hp.y-sh.y,.02);
 return {n,ls,rs,lw,rw,lk,rk,la,ra,sh,hp,sw,T,
  tilt:n90(deg(Math.atan2(ls.y-rs.y,ls.x-rs.x))), earTilt:n90(deg(Math.atan2(lear.y-rear.y,lear.x-rear.x))),
  lean:deg(Math.atan2(sh.x-hp.x,hp.y-sh.y)), twist:n90(deg(Math.atan2(ls.z-rs.z,ls.x-rs.x))),
  elL:ang(ls,le,lw), elR:ang(rs,re,rw), kneeDiff:(rk.y-lk.y)/T, seatR:((lk.y+rk.y)/2-hp.y)/T,
  ankL:(la.y-lk.y)/T, ankR:(ra.y-rk.y)/T, ankDiff:(ra.y-la.y)/T, ankDist:Math.abs(la.x-ra.x), kneeDist:Math.abs(lk.x-rk.x), headOff:(n.x-sh.x)/sw,
  vUpper:Math.min(ls.v,rs.v,lh.v,rh.v), vLegs:Math.min(lk.v,rk.v), vFeet:Math.min(la.v,ra.v)};
}

function newSession(){

 S={phase:'calib',i:0,score:0,streak:0,paused:false,calib:[],posture:null,phaseEnd:0,lastT:performance.now(),sm:null,rts:[],abs:viewAbs,
  items:plan.items.map(it=>{const p=POSE[it.id];return {...it,p,prm:{tier:ti,day:plan.d,phase:plan.phase,th:p.th?p.th[Math.min(ti,p.th.length-1)]:null,hold:p.hold?p.hold[ti]:0,tmo:p.tmo?p.tmo[ti]:0,len:p.len?p.len[ti]+(plan.phase>=4?1:0):0,per:(p.per||3)*T.slow*1000},done:0,good:0,held:0,state:'wait',flag:false,g:null,said:false};})};

function calibStep(f,now){
 if(f.vUpper<.5){S.calib=[];overlay(null,t('stepIn'),t('faceCam'));feedback(t('noPerson'),'warn');return;}
 if(Math.abs(f.lean)>10){S.calib=[];feedback(t('straight'),'warn');return;}
 S.calib.push(f);const need=50;overlay(Math.max(1,Math.ceil((need-S.calib.length)/17)),t('holdStill'),null);feedback(t('measuring'));
 if(S.calib.length<need)return;
 const avg=k=>S.calib.reduce((s,c)=>s+c[k],0)/S.calib.length;
 const tilt=Math.abs(avg('tilt')),lean=Math.abs(avg('lean')),head=Math.abs(avg('headOff'));
 const score=Math.round(Math.max(0,100-Math.min(30,tilt*4)-Math.min(30,lean*4)-Math.min(30,head*150)));
 const tips=[];if(tilt>3)tips.push(t('tipTilt'));if(lean>3)tips.push(t('tipLean'));if(head>.12)tips.push(t('tipHead'));
 S.posture={score,tips};overlay(score,t('postureScore'),tips.length?t('watch')+tips.join(', '):t('postureGood'));
 feedback(tips.length?t('standEven'):t('niceAlign'),tips.length?'warn':'good');say(t('postureScore')+' '+score);S.phase='posture';S.phaseEnd=now+4000;
}

/* ---------- modes ---------- */
function doReps(it,f,now,warn){const p=it.p,on=p.on(f,it.prm),off=p.off(f,it.prm);
 if(it.state==='wait'){if(off){it.state='rest';feedback(t('go'),'good');}else feedback(t('returnStart'),'warn');return;}
 if(it.state==='rest'&&on){it.state='active';it.flag=false;beep(520,60);}
 if(it.state==='active'){if(warn){it.flag=true;feedback(tx(warn),'warn');}else feedback(t('goodReturn'),'good');
  if(off){it.state='rest';const good=!it.flag;repDone(it,good);
   feedback(good?(S.streak>2?t('perfect',{n:S.streak}):t('goodRep')):t('repWarn'),good?'good':'warn');
   if(it.done>=it.target){finishItem(now);return;}}}
 else if(warn)feedback(tx(warn),'warn');
 setCount(it.done,'/ '+it.target,it.done/it.target);}
function doHold(it,f,now,dt,warn){const p=it.p;
 if(p.ok(f,it.prm)){it.held+=dt;if(Math.floor(it.held)>Math.floor(it.held-dt)){addScore(10);beep(660,50);}
  feedback(warn?tx(warn):t('holding'),warn?'warn':'good');
  if(p.sides&&!it.said&&it.held>=it.target/2){it.said=true;say(t('switchSide'));feedback(t('switchSide'),'good');}}
 else feedback(p.hint?tx(p.hint):t('beatMiss'),'warn');
 setCount(Math.floor(it.held),'/ '+it.target+' '+t('sec'),it.held/it.target);
 if(it.held>=it.target)finishItem(now);}
function doHoldReps(it,f,now,dt){const p=it.p,pr=it.prm;
 if(it.state==='wait'){if(p.off(f,pr))it.state='rest';else feedback(t('returnStart'),'warn');}
 else if(it.state==='rest'){if(p.ok(f,pr)){it.state='hold';it.hc=0;}else feedback(t('beatMiss'));}
 else if(it.state==='hold'){if(p.ok(f,pr)){it.hc+=dt;feedback(t('holdFor',{s:Math.max(1,Math.ceil(pr.hold-it.hc))}),'good');
   if(it.hc>=pr.hold){repDone(it,true);it.state='release';feedback(t('switchSide'),'good');if(it.done>=it.target){finishItem(now);return;}}}
  else{it.state='rest';feedback(t('holdFor',{s:Math.ceil(pr.hold)}),'warn');}}
 else if(it.state==='release'&&p.off(f,pr))it.state='rest';
 setCount(it.done,'/ '+it.target,(it.done+(it.state==='hold'?it.hc/pr.hold:0))/it.target);}
function doFollow(it,f,now){const p=it.p,per=it.prm.per;
 if(!it.bt){it.bt=now;it.fr=0;it.okf=0;it.beats=0;}
 it.fr++;if(p.check(f,it.prm))it.okf++;
 if(now-it.bt>=per){if(it.okf/it.fr>=.5){it.done++;it.good++;addScore(80);beep(880,90);feedback(t('beatOk'),'good');const left=it.target-it.done;if(left>0&&(TIERS[tk()].i>0||left<=3))say(String(it.done));}
  else{feedback(t('beatMiss'),'warn');beep(330,60);}
  it.beats++;it.bt=now;it.fr=it.okf=0;
  if(it.done>=it.target||it.beats>=Math.ceil(it.target*1.6)){finishItem(now);return;}}
 setCount(it.done,'/ '+it.target,(it.done+(now-it.bt)/per*.999)/it.target);}
function doChoice(it,f,now){const g=it.g||(it.g={n:0,st:'ready'});const p=it.p;
 if(g.st==='ready'){feedback(t('handsDown'));cue(null);
  if(bothLow(f)){g.tr=p.gen({tx,lang,rnd:Math.random,prm:it.prm,g});cue(g.tr.html);if(g.tr.speak)say(g.tr.speak);g.st=g.tr.memo?'memo':'cue';g.t0=now;g.cand=null;beep(700,60);}}
 else if(g.st==='memo'){feedback(t('memWatch'));if(now-g.t0>g.tr.memoMs){g.st='ready';cue(null);}}
 else if(g.st==='cue'){const s=armState(f),resp=['L','R','B','T'].includes(s)?s:null,exp=g.tr.exp,lim=it.prm.tmo*1000*(exp==='none'?.75:1);
  const judge=ok=>{g.n++;if(ok){it.done++;it.good++;}g.st='fb';g.until=now+(ok?900:1300);cue(null);};
  if(resp){if(resp!==g.cand){g.cand=resp;g.candT=now;}
   else if(now-g.candT>250){const rt=g.candT-g.t0;
    if(exp==='none'){beep(300,200);feedback(t('moved'),'warn');judge(false);}
    else if(resp===exp){S.rts.push(rt);addScore(100+Math.max(0,Math.round((it.prm.tmo*1000-rt)/40)));beep(990,120);feedback(t('correct')+' '+(rt/1000).toFixed(1)+' '+t('sec'),'good');judge(true);}
    else{beep(300,200);feedback(t('wrong'),'warn');judge(false);}}}
  else{g.cand=null;if(now-g.t0>lim){if(exp==='none'){addScore(100);beep(990,120);feedback(t('nogoOk'),'good');judge(true);}else{feedback(t('tooSlow'),'warn');judge(false);}}}}
 else if(g.st==='fb'&&now>g.until){g.st='ready';if(g.n>=it.target){finishItem(now);return;}}
 setCount(it.done,'/ '+it.target,g.n/it.target);}
function memCue(mv,label){cue(`<canvas data-pose="mv:${mv}"></canvas><div style="font-family:Mitr,sans-serif;font-size:28px">${label}</div>`);}
function doMemory(it,f,now){const g=it.g||(it.g={round:0,st:'new'});const len=it.prm.len,dur=[1300,1500,1900][TIERS[tk()].i];
 if(g.st==='new'){g.seq=[];const mv=['L','R','B','T'];while(g.seq.length<len){const m=mv[Math.floor(Math.random()*4)];if(m!==g.seq[g.seq.length-1])g.seq.push(m);}
  g.k=0;g.st='show';g.until=now+dur;memCue(g.seq[0],`1. ${t('mv'+g.seq[0])}`);feedback(t('memWatch'));say(t('memWatch'));}
 else if(g.st==='show'){if(now>g.until){g.k++;if(g.k<len){g.until=now+dur;memCue(g.seq[g.k],`${g.k+1}. ${t('mv'+g.seq[g.k])}`);beep(600,50);}
   else{g.st='do';g.idx=0;g.needRest=true;g.cand=null;cue(`<div class="cueword" style="font-size:44px">${t('memYour')}</div><div>${'○ '.repeat(len)}</div>`);say(t('memYour'));}}}
 else if(g.st==='do'){const s=armState(f);
  if(g.needRest){if(s==='rest')g.needRest=false;else feedback(t('handsDown'));}
  else if(s&&s!=='rest'){if(s===g.cand){if(now-g.candT>350){
     if(s===g.seq[g.idx]){g.idx++;beep(900,80);g.needRest=true;g.cand=null;
      cue(`<div class="cueword" style="font-size:44px">${t('memYour')}</div><div style="font-size:24px">${'● '.repeat(g.idx)+'○ '.repeat(len-g.idx)}</div>`);feedback(`✓ ${g.idx}/${len}`,'good');
      if(g.idx>=len){it.done++;it.good++;addScore(150+len*25);g.round++;g.st='fb';g.until=now+1600;feedback(t('memOk'),'good');say(t('memOk'));cue(null);}}
     else{g.round++;g.st='fb';g.until=now+2800;beep(300,200);feedback(t('memFail')+g.seq.map(m=>t('mv'+m)).join(' → '),'warn');cue(null);}}}
   else{g.cand=s;g.candT=now;}}}
 else if(g.st==='fb'&&now>g.until){if(g.round>=it.target){finishItem(now);return;}g.st='new';}
 setCount(it.done,'/ '+it.target,(g.round||0)/it.target);}
function work(f,now,dt){const it=S.items[S.i],p=it.p;
 if(!visible(f,p.need)){feedback(p.need==='upper'?t('needUpper'):t('needLegs'),'warn');return;}
 const warn=p.form?p.form(f,it.prm):null;
 if(p.mode==='reps')doReps(it,f,now,warn);else if(p.mode==='hold')doHold(it,f,now,dt,warn);else if(p.mode==='holdreps')doHoldReps(it,f,now,dt);
 else if(p.mode==='follow')doFollow(it,f,now);else if(p.mode==='choice')doChoice(it,f,now);else if(p.mode==='memory')doMemory(it,f,now);}

const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function draw(lm){const W=cv.width,H=cv.height;ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,W,H);ctx.restore();if(!lm)return;
 const X=i=>(1-lm[i].x)*W,Y=i=>lm[i].y*H,vis=i=>(lm[i].visibility??1)>.4;
 const it=S&&S.items[S.i],active=S&&S.phase==='work'&&it&&(it.state==='active'||it.state==='hold');
 if(S&&S.phase==='work'&&it&&it.p.guide){const f=feats(lm),g=it.p.guide(f,it.prm),gy=g.y*H,label=tx(g.label);
  ctx.setLineDash([18,12]);ctx.lineWidth=Math.max(3,W/300);ctx.strokeStyle='#FFC83D';ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();ctx.setLineDash([]);
  const fs=Math.round(W/32);ctx.font=`600 ${fs}px Mitr,Sarabun,sans-serif`;const tw=ctx.measureText(label).width;ctx.fillStyle='rgba(20,22,43,.8)';ctx.fillRect(14,gy-fs*1.6,tw+24,fs*1.4);ctx.fillStyle='#FFC83D';ctx.fillText(label,26,gy-fs*.55);}
 const col=active?'#FFC83D':'#ffffff';ctx.lineCap='round';ctx.lineWidth=Math.max(5,W/160);
 for(const [a,b] of BONES){if(!vis(a)||!vis(b))continue;ctx.strokeStyle=(a%2&&b%2)?(active?'#FFC83D':'#7FB2FF'):(!(a%2)&&!(b%2))?(active?'#FFC83D':'#FF8A8D'):col;ctx.beginPath();ctx.moveTo(X(a),Y(a));ctx.lineTo(X(b),Y(b));ctx.stroke();}
 for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){if(!vis(i))continue;ctx.fillStyle=i%2?'#2F80ED':'#FF5A5F';if(i===0)ctx.fillStyle='#8B5CF6';ctx.beginPath();ctx.arc(X(i),Y(i),Math.max(6,W/140),0,7);ctx.fill();}}

/* ---------- loop ---------- */
function smooth(lm){if(!S.sm||S.sm.length!==lm.length){S.sm=lm.map(p=>({...p}));return S.sm;}
 const a=.5;S.sm=lm.map((p,i)=>({x:a*p.x+(1-a)*S.sm[i].x,y:a*p.y+(1-a)*S.sm[i].y,z:a*(p.z||0)+(1-a)*(S.sm[i].z||0),visibility:p.visibility}));return S.sm;}
function loop(){raf=requestAnimationFrame(loop);if(video.readyState<2)return;
 const now=performance.now(),dt=Math.min((now-S.lastT)/1000,.25);S.lastT=now;
 let lm=null;try{const r=landmarker.detectForVideo(video,now);if(r.landmarks&&r.landmarks[0])lm=smooth(r.landmarks[0]);}catch(e){}
 draw(lm);
 if(S.paused){overlay('II',t('paused'),t('resumeHint'));return;}
 if(S.phase==='calib'){if(lm)calibStep(feats(lm),now);else{overlay(null,t('stepIn'),t('faceCam'));feedback(t('noPerson'),'warn');}return;}
 if(S.phase==='posture'){if(now>=S.phaseEnd)startIntro(now);return;}
 const it=S.items[S.i];
 if(S.phase==='intro'){const s=Math.ceil((S.phaseEnd-now)/1000);overlay(s>0?s:t('go'),tx(it.p.name),it.introSub,it.p.id);if(now>=S.phaseEnd)beginWork(now);return;}
 if(S.phase==='rest'){const s=Math.ceil((S.phaseEnd-now)/1000);overlay(s,t('rest'),t('nextUp')+tx(it.p.name),it.p.id);if(now>=S.phaseEnd)startIntro(now);return;}
 if(S.phase==='work'){if(lm)work(feats(lm),now,dt);else feedback(t('lost'),'warn');}}

/* ---------- end ---------- */
function endGame(){
 S.phase='end';stopCamera();try{speechSynthesis.cancel();}catch(e){}cue(null);
 const items=S.items,frac=i=>Math.min(1,(i.p.mode==='hold'?i.held:i.done)/i.target);
 const pct=items.reduce((s,i)=>s+frac(i),0)/items.length;
 const counted=items.filter(i=>['reps','holdreps'].includes(i.p.mode)),done=counted.reduce((s,i)=>s+i.done,0),good=counted.reduce((s,i)=>s+i.good,0);
 const fp=done?good/done:0,stars=pct>=.9&&fp>=.7?3:pct>=.6?2:pct>=.25?1:0;
 $('sScore').textContent=S.score;$('sStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
 $('sPosture').textContent=S.posture?S.posture.score:'–';$('sForm').textContent=done?Math.round(fp*100)+'%':'–';
 $('sRt').textContent=S.rts.length?(S.rts.reduce((a,b)=>a+b,0)/S.rts.length/1000).toFixed(2)+' '+t('sec'):'–';
 $('sRows').innerHTML=items.map(i=>{const h=i.p.mode==='hold',fc=['reps','holdreps'].includes(i.p.mode);
  return `<tr><td><span class="chip soft" style="--c:${CATC[i.p.cat]}">${t('cat_'+i.p.cat)}</span> ${tx(i.p.name)}</td><td class="n">${h?Math.floor(i.held)+' '+t('sec'):i.done}</td><td class="n">${targetTxt(i.p,i.target)}</td><td class="n">${fc&&i.done?Math.round(i.good/i.done*100)+'%':'–'}</td></tr>`;}).join('');
 const played=items.filter(i=>i.done>0||i.held>0),mus=[...new Set(played.flatMap(i=>tx(i.p.mus)))];
 $('sMus').innerHTML=mus.map(m=>`<span class="chip soft" style="--c:var(--grape)">${m}</span>`).join('')||'–';
 const cats=[...new Set(played.map(i=>i.p.cat))];
 $('sBens').innerHTML=BENEFITS.filter(b=>cats.includes(b.cat)).map(b=>`<div class="ben" style="--c:${CATC[b.cat]}"><h3>${tx(b.t)}</h3><p>${tx(b.d)}</p></div>`).join('');
 const tips=[];if(S.posture&&S.posture.tips.length)tips.push(t('watch')+S.posture.tips.join(', ')+'.');
 const worst=counted.filter(i=>i.done).sort((a,b)=>a.good/a.done-b.good/b.done)[0];
 if(worst&&worst.good/worst.done<.8)tips.push(t('tipForm',{x:tx(worst.p.name)}));
 $('sTips').textContent=tips.join(' ')||t('tipOk');
 $('doneTitle').textContent=stars===3?t('great'):stars===2?t('greatS'):t('goodStart');
 if(pct>=.3){const dm=doneMap();dm[S.abs]=Math.max(dm[S.abs]||0,S.score);store.set('pp2-done',dm);}
 $('game').classList.add('hide');$('done').classList.remove('hide');window.scrollTo(0,0);say(t('sessionDone',{s:S.score}));
}

/* ---------- flow ---------- */
async function begin(){
 $('err').textContent='';$('home').classList.add('hide');$('done').classList.add('hide');$('game').classList.remove('hide');window.scrollTo(0,0);
 try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
 newSession();overlay(null,t('loading'),t('loadingSub'));applyLang();
 try{await startCamera();}catch(e){backHome();$('err').textContent=e&&e.name==='insecure'?t('insecure'):t('camErr',{e:e.name||e.message});return;}
 try{await loadModel();}catch(e){backHome();$('err').textContent=t('modelErr');return;}
 overlay(null,t('stepIn'),t('faceCam'));say(t('postureHow'));S.lastT=performance.now();loop();
}
function backHome(){stopCamera();try{speechSynthesis.cancel();}catch(e){}$('game').classList.add('hide');$('done').classList.add('hide');$('home').classList.remove('hide');S=null;renderDay();}

/* ---------- wiring ---------- */
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;store.set('pp2-lang',lang);renderAll();}));
$('tiers').addEventListener('click',e=>{const b=e.target.closest('.tier');if(b)pick(b.dataset.k);});
$('age').addEventListener('input',e=>{const a=+e.target.value;if(!a)return;pick(a<55?'a':a<=65?'b':'c');});
for(const id of ['c1','c2','c3'])$(id).addEventListener('change',validate);
$('prevDay').addEventListener('click',()=>{if(viewAbs>0){viewAbs--;renderDay();}});
$('nextDay').addEventListener('click',()=>{viewAbs++;renderDay();});
$('todayBtn').addEventListener('click',()=>{viewAbs=todayAbs();renderDay();});
$('year').addEventListener('click',e=>{const d=e.target.closest('.dot');if(d){viewAbs=+d.dataset.abs;renderDay();$('today').scrollIntoView({behavior:'smooth'});}});
$('restartBtn').addEventListener('click',()=>{start=mid();store.set('pp2-start',start);store.set('pp2-done',{});viewAbs=0;renderDay();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-detail]');if(b)openDetail(b.dataset.detail);});
$('mClose').addEventListener('click',closeDetail);$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
$('startBtn').addEventListener('click',begin);
$('pauseBtn').addEventListener('click',()=>{if(!S||S.phase==='end')return;S.paused=!S.paused;applyLang();if(!S.paused){overlay(null,null);S.lastT=performance.now();if(S.phase==='rest'||S.phase==='intro')S.phaseEnd=performance.now()+3000;}});
$('skipBtn').addEventListener('click',()=>{if(!S)return;const now=performance.now();
 if(S.phase==='calib'||S.phase==='posture')startIntro(now);else if(S.phase==='rest')startIntro(now);
 else if(S.phase==='work'||S.phase==='intro'){cue(null);S.i++;renderQueue();if(S.i>=S.items.length)endGame();else startIntro(now);}});
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;applyLang();if(!soundOn)try{speechSynthesis.cancel();}catch(e){}});
$('endBtn').addEventListener('click',()=>{if(S&&S.phase!=='end')endGame();});
$('againBtn').addEventListener('click',begin);$('homeBtn').addEventListener('click',backHome);
renderAll();
}
</script>
