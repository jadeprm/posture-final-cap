<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>โรงพยาบาลพหุภพ · ต้นแบบกิจกรรมออกกำลังกายและบริหารสมอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Multiverse Hospital for Cognitive Health of Thai Older Adults — Activity 8 Exercise Prototype
   Bright Sunny Mode · Colourful High-Contrast Elderly-Centric UI · Large Camera & Pose Guide */
:root{
 color-scheme:light;
 --sun:#FFD43B;--sun-deep:#F59E0B;--sun-soft:#FFF7D1;
 --brand:#0D9488;--brand-h:#0F766E;--brand-soft:#E0FAF6;
 --rose:#E83E8C;--sky:#2563EB;--grape:#7C3AED;--teal:#0EA5A0;--coral:#FF5A5F;--gold:#D97706;--orange:#F97316;--emerald:#10B981;
 --bg:#FFFDF5;
 --card:#FFFFFF;
 --soft:#FFF7DF;
 --warm:#FFF1C9;
 --ink:#16243D;
 --mute:#475569;
 --line:#E9DFC3;
 --shadow:0 6px 20px rgba(22,36,61,.08),0 2px 6px rgba(22,36,61,.04);
 --radius:20px;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 Sarabun,"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body.big{font-size:21px;line-height:1.7}
h1,h2,h3,h4{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;line-height:1.25;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(30px,4.2vw,46px)}
h2{font-size:clamp(24px,3vw,32px)}
h3{font-size:20px}
.wrap{max-width:1220px;margin:0 auto;padding:clamp(24px,4vw,44px) max(4vw,16px)}
.hide{display:none!important}
button,input{font:inherit;color:inherit}
button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:8px 18px;cursor:pointer;font-weight:600;transition:border-color .15s,background-color .15s,transform .1s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--brand);box-shadow:0 4px 12px rgba(13,148,136,.14)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.48;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.primary{background:linear-gradient(135deg,#FF5A5F 0%,#F97316 100%);border-color:#EA580C;color:#fff;font-size:21px;padding:15px 34px;min-height:58px;box-shadow:0 8px 22px rgba(249,115,22,.32)}
.primary:hover:not(:disabled){background:linear-gradient(135deg,#F43F5E 0%,#EA580C 100%);border-color:#C2410C;box-shadow:0 10px 26px rgba(249,115,22,.4)}
.primary:disabled{background:#CBD5E1;border-color:#CBD5E1;color:#64748B;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 14px;font-size:14.5px;font-weight:700;color:#fff;background:var(--c,var(--brand));white-space:nowrap}
.chip.soft{background:color-mix(in srgb,var(--c,var(--brand)) 14%,#fff);color:color-mix(in srgb,var(--c,var(--brand)) 72%,#16243D);border:1.5px solid color-mix(in srgb,var(--c,var(--brand)) 35%,transparent)}
.stepBadge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-size:14px;font-weight:700;background:var(--sun);color:#16243D;border:1.5px solid #EAB308}
/* Institutional Top Header */
.top{position:sticky;top:0;z-index:8;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:4px solid var(--sun);box-shadow:0 2px 12px rgba(22,36,61,.06)}
.topin{max-width:1220px;margin:0 auto;padding:11px max(4vw,16px);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ident{display:flex;align-items:center;gap:12px;min-width:0}
.emblem{width:46px;height:46px;flex:none;border-radius:15px;background:linear-gradient(135deg,#FFE66D 0%,#FFD43B 100%);border:2px solid #F59E0B;display:grid;place-items:center;color:#0F766E;box-shadow:0 4px 10px rgba(245,158,11,.24)}
.idtxt{min-width:0}
.idrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.idtitle{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;font-size:19.5px;line-height:1.2;color:var(--ink)}
.protoTag{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:#FEF3C7;color:#B45309;border:1.5px solid #F59E0B;white-space:nowrap}
.idsub{font-size:13.5px;color:var(--mute);line-height:1.3;margin-top:2px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sun-soft);padding:3px;border-radius:12px;border:1.5px solid #FCD34D;gap:3px}
.seg button{min-height:40px;padding:4px 14px;border-radius:9px;border:1.5px solid transparent;background:transparent;font-size:15px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#FFD43B;border-color:var(--ink)}
.sizeBtn{min-height:44px;padding:6px 14px;font-size:15px;border-radius:12px;background:#fff;border-color:#F59E0B;color:var(--ink)}
.sizeBtn[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:#fff}
/* Sunshine Yellow Colourful Hero */
.hero{background:linear-gradient(135deg,#FFE97F 0%,#FFD43B 55%,#FFC42E 100%);border-bottom:3px solid #F59E0B;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.95fr);gap:clamp(22px,4vw,42px);align-items:start;padding-top:clamp(24px,3.5vw,40px);padding-bottom:clamp(28px,4vw,46px)}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:#0F766E;background:#FFFFFF;border:2px solid #0EA5A0;padding:6px 15px;border-radius:999px;margin-bottom:14px;box-shadow:0 3px 10px rgba(22,36,61,.08)}
.kicker::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--coral)}
.hero h1{color:#16243D}
.hero p.lede{font-size:19.5px;color:#1E293B;max-width:54ch;margin:14px 0 0;font-weight:500}
.trust{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.trust span{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:13px;background:#FFFFFF;border:2px solid rgba(22,36,61,.12);font-size:14.5px;font-weight:700;color:var(--ink);box-shadow:0 3px 8px rgba(22,36,61,.07)}
.trust span::before{content:"✓";color:#0D9488;font-weight:800;font-size:16px}
.heroFig{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:22px}
.heroTile{background:#FFFFFF;border:2px solid color-mix(in srgb,var(--c,#0D9488) 40%,#fff);border-top:5px solid var(--c,#0D9488);border-radius:18px;padding:8px 7px 7px;text-align:center;box-shadow:0 8px 18px rgba(22,36,61,.1)}
.heroTile canvas{width:100%;height:106px;display:block;background:color-mix(in srgb,var(--c,#0D9488) 9%,#FFFDF7);border-radius:12px}
.heroTile span{display:block;font-size:13px;font-weight:700;color:var(--c,#16243D);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Step 1 Age / Level Card */
.agebox{background:#FFFFFF;border:3px solid #FFFFFF;border-radius:26px;padding:24px;box-shadow:0 16px 36px rgba(180,83,9,.18)}
.agebox h2{font-size:23px;margin-top:10px;color:var(--ink)}
.agebox .hint{font-size:15.5px;color:var(--mute);margin:6px 0 14px}
.agebox label{display:block;font-weight:700;margin-bottom:6px;font-size:16px}
.agebox input{width:100%;font-size:24px;font-weight:700;padding:10px 16px;border-radius:14px;border:2px solid #FCD34D;background:#FFFDF5;color:var(--ink)}
.agebox input:focus{border-color:var(--orange);background:#FFFFFF}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.tier{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:13px 12px;border-radius:16px;border:2px solid color-mix(in srgb,var(--c) 38%,#E2E8F0);background:color-mix(in srgb,var(--c) 7%,#fff);color:var(--ink);text-align:left;min-height:94px;position:relative}
.tier:hover{border-color:var(--c);transform:translateY(-1px)}
.tier b{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-size:18px;color:var(--c);line-height:1.2}
.tier span{font-size:14.5px;color:#334155;font-weight:600}
.tier[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 38%,transparent)}
.tier[aria-pressed=true] b,.tier[aria-pressed=true] span{color:#fff}
.tier[aria-pressed=true]::after{content:"✓";position:absolute;top:8px;right:10px;font-size:16px;font-weight:800}
/* Step 2 Game Mode Picker + Today Routine */
.modeWrap{background:linear-gradient(135deg,#FFF9DF 0%,#FFFDF7 100%);border:2.5px solid #FCD34D;border-radius:24px;padding:20px 22px;margin-bottom:24px;box-shadow:var(--shadow)}
.modeHead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.modeHead h2{font-size:clamp(21px,2.5vw,27px);margin-top:6px}
.modeGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}
.modeCard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 13px;border-radius:18px;border:2.5px solid color-mix(in srgb,var(--c) 35%,#E2E8F0);background:#FFFFFF;color:var(--ink);text-align:left;position:relative;min-height:122px;box-shadow:0 3px 10px rgba(22,36,61,.05)}
.modeCard:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 22%,transparent)}
.modeIco{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c);display:grid;place-items:center;font-size:21px;line-height:1}
.modeCard b{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-size:16.5px;line-height:1.25;color:var(--ink)}
.modeCard span{font-size:13.5px;color:var(--mute);line-height:1.35;font-weight:500}
.modeCard[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--c) 38%,transparent)}
.modeCard[aria-pressed=true] b,.modeCard[aria-pressed=true] span{color:#fff}
.modeCard[aria-pressed=true] .modeIco{background:rgba(255,255,255,.22);color:#fff}
.modeCard[aria-pressed=true]::after{content:"✓";position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:#FFD43B;color:#16243D;display:grid;place-items:center;font-size:14px;font-weight:800}
.dayhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid #FDE68A}
.meta{color:var(--mute);margin:6px 0 0;font-size:16px}
.daynav{display:flex;gap:8px;flex-wrap:wrap}
.daynav button{min-height:46px;font-size:16px;background:#FFFFFF;border-color:#FCD34D}
.daynav button:hover:not(:disabled){background:var(--sun-soft);border-color:var(--sun-deep)}
.parts{display:grid;gap:18px;margin-top:22px}
.part{border-radius:22px;padding:18px;background:color-mix(in srgb,var(--c) 5%,#FFFFFF);border:2px solid color-mix(in srgb,var(--c) 26%,#E5E7EB);border-top:6px solid var(--c);box-shadow:var(--shadow)}
.parthead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 14px;flex-wrap:wrap}
.part h3{color:var(--ink);font-size:20px;display:flex;align-items:center;gap:10px}
.part h3::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.mv{display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:14px;align-items:center;background:#FFFFFF;border:2px solid color-mix(in srgb,var(--c) 22%,#E5E7EB);border-radius:16px;padding:10px 12px;transition:border-color .15s,transform .12s}
.mv:hover{border-color:var(--c);transform:translateY(-1px)}
.mv canvas,.mv img.ph{width:88px;height:100px;border-radius:12px;background:color-mix(in srgb,var(--c) 8%,#FFFDF7);border:1.5px solid color-mix(in srgb,var(--c) 24%,#E5E7EB);object-fit:cover}
.mv b{display:block;font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-size:17.5px;line-height:1.3;margin-bottom:3px}
.mv small{display:block;color:var(--mute);font-size:14.5px;line-height:1.45}
.mv button{min-height:44px;padding:6px 14px;font-size:15px;border-color:color-mix(in srgb,var(--c) 55%,#E5E7EB);color:color-mix(in srgb,var(--c) 80%,#16243D);background:color-mix(in srgb,var(--c) 8%,#fff)}
.mv button:hover{background:var(--c);border-color:var(--c);color:#fff}
/* Step 3 Readiness & Start Panel */
.readyBox{margin-top:24px;background:linear-gradient(135deg,#FFFFFF 0%,#FFFDF2 100%);border:2.5px solid #FCD34D;border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.readyBox h3{margin-top:10px;font-size:22px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:15px;border-radius:16px;background:#FFFDF5;border:2px solid #E9DFC3;cursor:pointer;transition:border-color .15s,background-color .15s}
.check:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.check input{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--brand);cursor:pointer}
.safety{margin:16px 0 0;padding:15px 18px;border-left:6px solid var(--coral);background:#FFF1F2;border-radius:0 16px 16px 0;font-size:15.5px;line-height:1.6;color:#4C1D24}
.go{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px}
.readyHint{font-size:15.5px;color:var(--mute);font-weight:700}
.readyHint.ok{color:#0F766E}
.err{color:#DC2626;font-weight:700;margin:10px 0 0}
/* 365-Day Routine & Progression */
.plan{background:linear-gradient(180deg,#FFF6CE 0%,#FFFDF5 100%);border-top:2.5px solid #FCD34D;border-bottom:2.5px solid #FCD34D}
.routineBar{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0 20px}
.rstat{background:#FFFFFF;border:2px solid #FDE68A;border-top:5px solid var(--c,var(--sun-deep));border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.rstat span{display:block;font-size:14.5px;color:var(--mute);font-weight:600}
.rstat b{display:block;font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-size:28px;color:var(--c,var(--ink));margin-top:2px;font-variant-numeric:tabular-nums}
.phasebar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:16px 0 12px}
.phasebar div{background:#FFFFFF;color:var(--ink);border:2px solid color-mix(in srgb,var(--c) 30%,#E5E7EB);border-top:6px solid var(--c);border-radius:15px;padding:10px 12px;font-size:14.5px;line-height:1.35}
.phasebar b{display:block;font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;color:var(--c)}
.phasebar div.now{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#FFFFFF);box-shadow:0 0 0 2px var(--c)}
.yearCard{background:#FFFFFF;border:2px solid #FDE68A;border-radius:20px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.year{display:grid;gap:7px}
.mrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:center}
.mrow span{font-size:14px;color:var(--mute);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:21px;height:21px;min-height:0;padding:0;border-radius:50%;border:2.5px solid var(--c);background:transparent}
.dot.done{background:var(--c)}.dot.today{box-shadow:0 0 0 3px var(--ink)}.dot.view{transform:scale(1.3)}.dot.easy{border-style:dashed}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin-top:12px}
.week div{background:color-mix(in srgb,var(--c) 8%,#FFFFFF);color:var(--ink);border:2px solid color-mix(in srgb,var(--c) 30%,#E5E7EB);border-left:6px solid var(--c);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.35;font-weight:700}
.week small{display:block;color:var(--mute);font-weight:600;margin-top:2px}
/* Benefits */
.bens{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.ben{background:color-mix(in srgb,var(--c) 7%,#FFFFFF);color:var(--ink);border:2px solid color-mix(in srgb,var(--c) 28%,#E5E7EB);border-top:6px solid var(--c);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.ben h3{margin-bottom:8px;color:var(--c);font-size:19.5px}
.ben p{margin:0;font-size:15.5px;color:#334155;line-height:1.6}
.who{margin-top:18px;padding:15px 18px;border-radius:16px;background:var(--sun-soft);border:2px solid #FCD34D;color:#334155;font-size:15.5px;font-weight:500}
/* Institutional Footer */
.foot{background:#FFFFFF;border-top:4px solid var(--sun);margin-top:20px}
.footin{max-width:1220px;margin:0 auto;padding:28px max(4vw,16px) 36px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.foot h3{font-size:18px;color:var(--ink);margin-bottom:6px}
.foot p{margin:4px 0;font-size:14.5px;color:var(--mute);line-height:1.6}
.footCard{background:#FFFDF0;border:2px solid #FDE68A;border-radius:16px;padding:16px 18px}
.footCard b{display:block;font-size:15px;color:#B45309;margin-bottom:4px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:#FFFFFF;border:3px solid var(--sun);border-radius:24px;max-width:980px;width:100%;max-height:92vh;overflow:auto;padding:24px;position:relative;box-shadow:0 24px 60px rgba(15,23,42,.24)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px}
.mgrid canvas{width:100%;aspect-ratio:5/6;border-radius:18px;background:#FFFDF5;border:2px solid #FDE68A}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}.photos figure{margin:0}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:2px solid #FDE68A;display:block}.photos figcaption{font-size:14px;color:var(--mute);margin-top:4px;text-align:center}
.sheet ol{padding-left:1.3em;margin:8px 0}.sheet li{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.legend{font-size:14px;color:var(--mute);margin-top:8px}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}
.mphase{font-size:15px;font-weight:700;color:var(--rose)}
.mbar button{min-height:40px;padding:5px 14px;font-size:14.5px;border-radius:10px}
.mbar button[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:#fff}
.mudras{display:grid;gap:8px;margin-top:10px}
.mudra{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:#FFFDF2;border:1.5px solid #FDE68A;font-size:14px;line-height:1.4}
.mgrid .mudra canvas{width:56px;height:56px;aspect-ratio:1/1;margin:0;flex:none;border-radius:12px;background:#FFFFFF;border:1.5px solid #FDE68A}
.mudra b{display:block;font-size:15px}
.mudra small{display:block;color:var(--mute);font-size:13px}
.xbtn{position:absolute;top:14px;right:14px;min-height:42px;padding:6px 14px;background:#FFF7D1;border-color:#F59E0B}
/* Active Camera Session — Large Camera, Large Pose Example & Large Readable Description */
.game{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(440px,1fr);gap:18px;padding:14px clamp(12px,2vw,24px) 24px;max-width:1740px;width:100%;margin:0 auto;align-items:start}
.gameLeft{display:flex;flex-direction:column;gap:14px}
.stage{position:relative;width:100%;border-radius:24px;overflow:hidden;background:#0F172A;border:3.5px solid var(--sun);aspect-ratio:16/9;min-height:min(60vh,520px);box-shadow:0 12px 32px rgba(22,36,61,.16)}
.stage>canvas{position:absolute;inset:0;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(15,23,42,.74);backdrop-filter:blur(4px);padding:22px;gap:12px}
.ovpics{display:flex;gap:14px;align-items:stretch;justify-content:center}
#ovDemo{width:clamp(190px,28vh,270px);height:clamp(220px,32vh,310px);background:#FFFDF5;border:3px solid var(--sun);border-radius:20px}
#ovPhoto{width:clamp(175px,26vh,250px);height:clamp(220px,32vh,310px);object-fit:cover;border:3px solid #fff;border-radius:20px}
.ovbig{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;font-size:clamp(48px,8.5vw,104px);line-height:1;color:#FFD43B;text-shadow:0 4px 16px rgba(0,0,0,.35)}
.ovmsg{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;font-size:clamp(24px,3vw,36px);max-width:26ch}
.ovsub{font-size:clamp(18px,1.7vw,22px);opacity:.96;max-width:48ch;line-height:1.45}
.cue{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:rgba(255,255,255,.98);color:#16243D;border:3px solid var(--sun);border-radius:22px;padding:18px 30px;text-align:center;min-width:270px;box-shadow:0 14px 36px rgba(0,0,0,.28)}
.cueword{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;font-size:clamp(54px,8.5vw,108px);line-height:1}
.cue canvas{width:165px;height:185px}
.cuerule{font-size:20px;margin-top:8px;max-width:30ch;margin-inline:auto;line-height:1.35;font-weight:700}.cuearrows{letter-spacing:.06em;white-space:nowrap}.cuearrows b{color:var(--rose)}
.cuepair{display:flex;gap:24px;justify-content:center;font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;font-size:clamp(46px,8vw,92px);line-height:1.1}.cuepair span{background:#FFF3C4;border-radius:16px;padding:8px 22px;min-width:2.2em}
.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.pill{background:rgba(15,23,42,.86);color:#fff;border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 18px;font-weight:700;font-size:17px}
#hudScore{background:var(--sun);color:#16243D;border-color:#F59E0B}
.fb{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-size:clamp(21px,1.9vw,27px);font-weight:700;padding:16px 20px;border-radius:18px;background:#FFF8D6;border:2.5px solid #F59E0B;color:#16243D;min-height:70px;display:flex;align-items:center;box-shadow:var(--shadow)}
.fb.good{background:#DCFCE7;border-color:#16A34A;color:#14532D}.fb.warn{background:#FFEDD5;border-color:#EA580C;color:#7C2D12}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.btns button{min-height:54px;font-size:17px;border-width:2px;background:#FFFFFF}
#gameMirrorBtn[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:#fff}
#endBtn{border-color:#FCA5A5;color:#B91C1C;background:#FFF5F5}
#endBtn:hover{background:#EF4444;border-color:#EF4444;color:#fff}
.panel{display:flex;flex-direction:column;gap:14px}
.card{border:2.5px solid #FDE68A;border-radius:22px;padding:18px;background:#FFFFFF;box-shadow:var(--shadow)}
.coach{display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--c,var(--rose))}
.coachHead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--sun-soft);border:1.5px solid #F59E0B;font-size:15px;color:#92400E;font-weight:700}
.coachPhase{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;background:#FCE7F3;border:1.5px solid #F472B6;font-size:15px;color:#9D174D;font-weight:700}
.coachpics{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch}
.coachpics.single{grid-template-columns:minmax(0,1fr)}
.coachpics.single #demo{max-width:340px;margin:0 auto}
.coachpics canvas{width:100%;height:clamp(215px,28vh,290px);border-radius:16px;background:#FFFDF5;border:2px solid #FDE68A;display:block}
.coachpics img{width:100%;height:clamp(215px,28vh,290px);object-fit:cover;border-radius:16px;border:2px solid #FDE68A;display:block}
.coachTitle{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-size:clamp(24px,2.2vw,31px);line-height:1.25;color:var(--ink);margin:2px 0 0}
.coachSteps{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;counter-reset:st}
.coachSteps li{counter-increment:st;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;font-size:clamp(18px,1.45vw,21.5px);line-height:1.45;color:#1E293B;font-weight:600;background:#FFFDF5;border:1.5px solid #FDE68A;border-radius:13px;padding:9px 12px}
.coachSteps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--c,var(--brand));color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;margin-top:1px}
.counterCard{background:linear-gradient(135deg,#FFFFFF 0%,#FFFDF2 100%)}
.count{font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-weight:700;font-size:clamp(58px,5.4vw,86px);line-height:1;color:var(--c,var(--brand));font-variant-numeric:tabular-nums}
.count small{font-size:.38em;color:var(--mute)}
.count.pulse{animation:pulse .35s ease-out}@keyframes pulse{from{transform:scale(1.1)}to{transform:scale(1)}}
.bar{height:18px;border-radius:99px;background:#FEF3C7;border:1.5px solid #FDE68A;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:var(--c,var(--brand));transition:width .25s}
.queueCard{padding:14px}
.queue{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15.5px;max-height:220px;overflow-y:auto}
.queue li{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:12px;background:#FFFDF8;border:1.5px solid #FDE68A;border-left:6px solid var(--c)}
.queue li.now{background:var(--sun-soft);border-color:#F59E0B;font-weight:700}.queue li.did{opacity:.52;text-decoration:line-through}
/* Summary */
.sumtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin:22px 0}
.stat{border-radius:20px;padding:18px;background:color-mix(in srgb,var(--c) 7%,#FFFFFF);border:2px solid color-mix(in srgb,var(--c) 26%,#E5E7EB);border-top:6px solid var(--c);color:var(--ink);box-shadow:var(--shadow)}
.stat span{font-size:14.5px;color:var(--mute);font-weight:600}
.stat b{display:block;font-family:"IBM Plex Sans Thai",Sarabun,sans-serif;font-size:40px;line-height:1.15;color:var(--c);margin-top:4px;font-variant-numeric:tabular-nums}
.stars{font-size:34px;letter-spacing:3px;color:#F59E0B;margin-top:4px}
.tableWrap{background:#FFFFFF;border:2px solid #FDE68A;border-radius:20px;padding:8px 16px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #F3E8C8;text-align:left}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media(max-width:1080px){.game{grid-template-columns:minmax(0,1fr)}.stage{min-height:0}.modeGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.bens{grid-template-columns:repeat(2,minmax(0,1fr))}.footin{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.modeGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.week{grid-template-columns:repeat(2,minmax(0,1fr))}.phasebar{grid-template-columns:repeat(2,minmax(0,1fr))}.mgrid{grid-template-columns:minmax(0,1fr)}.mgrid canvas{max-width:340px;margin:0 auto}.mgrid .mudra canvas{width:56px;height:56px;margin:0}}
@media(max-width:600px){.tiers{grid-template-columns:minmax(0,1fr)}.tier{min-height:0}.modeGrid{grid-template-columns:minmax(0,1fr)}.modeCard{min-height:0}.bens{grid-template-columns:minmax(0,1fr)}.heroFig{grid-template-columns:repeat(2,minmax(0,1fr))}.stage{aspect-ratio:4/5}.mv{grid-template-columns:68px minmax(0,1fr)}.mv canvas,.mv img.ph{width:68px;height:78px}.mv button{grid-column:1/-1}.coachpics canvas,.coachpics img{height:190px}#ovDemo,#ovPhoto{width:145px;height:175px}table{font-size:14px}.mrow{grid-template-columns:minmax(0,1fr)}.dot{width:19px;height:19px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}.count.pulse{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="topin">
 <div class="ident">
  <div class="emblem" aria-hidden="true">
   <svg viewBox="0 0 36 36" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6c-3.8 4.4-5.2 8.2-5.2 12a5.2 5.2 0 0 0 10.4 0c0-3.8-1.4-7.6-5.2-12Z" fill="currentColor" fill-opacity=".14"/>
    <path d="M12.8 18.2C8.6 17.5 5.6 15.2 5 11.4c3.6-.3 6.8 1 8.8 3.6"/>
    <path d="M23.2 18.2c4.2-.7 7.2-3 7.8-6.8-3.6-.3-6.8 1-8.8 3.6"/>
    <path d="M9 27.5h18" stroke="#B87D14" stroke-width="2.4"/>
    <path d="M13 23.5h10" stroke="#B83B64" stroke-width="2"/>
   </svg>
  </div>
  <div class="idtxt">
   <div class="idrow"><span class="idtitle" id="brand" data-t="brand"></span><span class="protoTag" data-t="protoBadge"></span></div>
   <div class="idsub" data-t="orgSub"></div>
  </div>
 </div>
 <div class="controls">
  <button type="button" class="sizeBtn" id="bigBtn" aria-pressed="false" data-t="textSize"></button>
  <div class="seg lang" role="group" aria-label="Language"><button type="button" data-lang="th">ไทย</button><button type="button" data-lang="en">EN</button></div>
 </div>
</div></header>

<main id="home">
 <section class="hero"><div class="wrap">
  <div>
   <span class="kicker" data-t="heroKicker"></span>
   <h1 data-t="title"></h1>
   <p class="lede" data-t="lede"></p>
   <div class="trust">
    <span data-t="trust1"></span>
    <span data-t="trust2"></span>
    <span data-t="trust3"></span>
   </div>
   <div class="heroFig">
    <div class="heroTile" style="--c:var(--rose)"><canvas data-pose="t7"></canvas><span data-t="heroTile1"></span></div>
    <div class="heroTile" style="--c:var(--coral)"><canvas data-pose="t5"></canvas><span data-t="heroTile2"></span></div>
    <div class="heroTile" style="--c:var(--teal)"><canvas data-pose="t1"></canvas><span data-t="heroTile3"></span></div>
    <div class="heroTile" style="--c:var(--grape)"><canvas data-pose="crosscrawl"></canvas><span data-t="heroTile4"></span></div>
   </div>
  </div>
  <div class="agebox">
   <span class="stepBadge" data-t="step1Badge"></span>
   <h2 data-t="step1Title"></h2>
   <p class="hint" data-t="step1Hint"></p>
   <label for="age" data-t="ageLabel"></label>
   <input id="age" type="number" inputmode="numeric" min="10" max="110">
   <div class="tiers" id="tiers"></div>
  </div>
 </div></section>

 <section class="wrap" id="today">
  <div class="modeWrap">
   <div class="modeHead">
    <div>
     <span class="stepBadge" data-t="step2Badge"></span>
     <h2 data-t="modeTitle"></h2>
     <p class="meta" data-t="modeHint"></p>
    </div>
   </div>
   <div class="modeGrid" id="modePicker" role="group" aria-label="Game modes"></div>
  </div>
  <div class="dayhead">
   <div>
    <div><span class="chip" id="dayChip"></span> <span class="chip" id="phaseChip"></span> <span class="chip hide" id="easyChip" style="--c:var(--teal)"></span></div>
    <h2 id="dayTitle" style="margin-top:10px"></h2>
    <p class="meta" id="dayMeta"></p>
   </div>
   <div class="daynav" id="dayNav"><button id="prevDay" data-t="prev"></button><button id="todayBtn" data-t="backToday"></button><button id="nextDay" data-t="next"></button></div>
  </div>
  <div class="parts">
   <div class="part" id="part1Wrap" style="--c:var(--teal)"><div class="parthead"><h3 data-t="part1"></h3></div><ol class="moves" id="list1"></ol></div>
   <div class="part" id="part2Wrap" style="--c:var(--rose)"><div class="parthead"><h3 data-t="part2"></h3></div><ol class="moves" id="list2"></ol></div>
  </div>
  <div class="readyBox">
   <span class="stepBadge" data-t="step3Badge"></span>
   <h3 data-t="step3Title"></h3>
   <div class="setup">
    <label class="check"><input type="checkbox" id="c1"><span data-t="c1"></span></label>
    <label class="check"><input type="checkbox" id="c2"><span data-t="c2"></span></label>
    <label class="check"><input type="checkbox" id="c3"><span data-t="c3"></span></label>
   </div>
   <p class="safety" data-th="safety"></p>
   <div class="go">
    <button class="primary" id="startBtn" data-t="start" disabled></button>
    <div><div class="readyHint" id="readyHint"></div><div class="meta" id="doneLine"></div></div>
   </div>
   <p class="err" id="err"></p>
  </div>
 </section>

 <section class="plan"><div class="wrap">
  <h2 data-t="planTitle"></h2>
  <p class="meta" data-t="planLede"></p>
  <div class="routineBar">
   <div class="rstat" style="--c:var(--teal)"><span data-t="statDays"></span><b id="rDays">0</b></div>
   <div class="rstat" style="--c:var(--coral)"><span data-t="statStreak"></span><b id="rStreak">0</b></div>
   <div class="rstat" style="--c:var(--grape)"><span data-t="statPhase"></span><b id="rPhase">–</b></div>
  </div>
  <div class="phasebar" id="phaseBar"></div>
  <div class="yearCard"><div class="year" id="year"></div></div>
  <h3 data-t="weekTitle" style="margin-top:26px"></h3>
  <div class="week" id="week"></div>
  <div class="go"><button id="restartBtn" data-t="restart"></button></div>
 </div></section>

 <section class="wrap">
  <h2 data-t="benefitsTitle"></h2>
  <div class="bens" id="bens"></div>
  <p class="who" data-t="who"></p>
 </section>

 <footer class="foot"><div class="footin">
  <div>
   <h3 data-t="footProject"></h3>
   <p data-t="footProjectEn"></p>
   <p data-t="footUnit"></p>
   <p data-t="footFund"></p>
  </div>
  <div class="footCard">
   <b data-t="footNoticeTitle"></b>
   <p data-t="footNoticeBody"></p>
  </div>
 </div></footer>
</main>

<div class="modal hide" id="modal" role="dialog" aria-modal="true" aria-labelledby="mName"><div class="sheet">
 <button class="xbtn" id="mClose" data-t="close"></button>
 <div class="mgrid"><div><canvas id="mFig"></canvas><div id="mThaiBar" class="mbar hide"><span class="mphase" id="mPhase"></span><button type="button" id="mMirror" aria-pressed="false" data-t="mirrorView"></button></div><p class="legend" id="mLegend" data-t="legend"></p><div id="mMudraWrap" class="hide"><h3 data-t="mudrasTitle" style="margin-top:12px"></h3><div class="mudras" id="mMudras"></div></div><div id="mPhotoWrap" class="hide"><h3 data-t="realPhotos" style="margin-top:12px"></h3><div class="photos" id="mPhotos"></div><p class="legend" data-t="photoCredit"></p></div></div>
 <div><div class="chips" id="mChips"></div><h2 id="mName"></h2><h3 style="margin-top:14px" data-t="steps"></h3><ol id="mSteps"></ol>
 <h3 data-t="muscles"></h3><div class="chips" id="mMus"></div><h3 data-t="benefit"></h3><p id="mBen"></p></div></div>
</div></div>

<section id="game" class="game hide">
 <div class="gameLeft">
  <div class="stage" id="stage">
   <canvas id="cv"></canvas><video id="vid" playsinline muted class="hide"></video>
   <div class="hud"><span class="pill" id="hudTier"></span><span class="pill" id="hudScore">0</span></div>
   <div class="cue hide" id="cue"></div>
   <div class="overlay" id="ov"><div class="ovpics"><canvas id="ovDemo" class="hide"></canvas><img id="ovPhoto" class="hide" alt=""></div><div class="ovbig" id="ovBig"></div><div class="ovmsg" id="ovMsg"></div><div class="ovsub" id="ovSub"></div></div>
  </div>
  <div class="fb" id="fb" aria-live="polite"></div>
  <div class="btns"><button id="pauseBtn" data-t="pause"></button><button id="skipBtn" data-t="skip"></button><button id="soundBtn"></button><button type="button" id="gameMirrorBtn" aria-pressed="false" data-t="mirrorView"></button><button id="endBtn" data-t="end"></button></div>
 </div>
 <aside class="panel">
  <div class="card coach" id="coachCard">
   <div class="coachHead"><span class="step" id="step"></span><span class="coachPhase hide" id="coachPhase"></span></div>
   <div class="coachpics single" id="coachPics"><canvas id="demo"></canvas><img id="coachPhoto" class="hide" alt=""></div>
   <h3 class="coachTitle" id="exName"></h3>
   <ol class="coachSteps" id="exHow"></ol>
   <div class="chips" id="exMus" style="margin:2px 0 0"></div>
  </div>
  <div class="card counterCard"><div class="count" id="count">–</div><div class="bar"><i id="barFill"></i></div></div>
  <div class="card queueCard"><ol class="queue" id="queue"></ol></div>
 </aside>
</section>

<section id="done" class="wrap hide">
 <span class="stepBadge" data-t="doneBadge" style="margin-bottom:10px"></span>
 <h2 id="doneTitle"></h2>
 <div class="sumtop">
  <div class="stat" style="--c:var(--brand)"><span data-t="totalScore"></span><b id="sScore">0</b></div>
  <div class="stat" style="--c:var(--gold)"><span data-t="rating"></span><div class="stars" id="sStars"></div></div>
  <div class="stat" style="--c:var(--sky)"><span data-t="posture"></span><b id="sPosture">–</b></div>
  <div class="stat" style="--c:var(--teal)"><span data-t="goodForm"></span><b id="sForm">–</b></div>
  <div class="stat" style="--c:var(--grape)"><span data-t="reaction"></span><b id="sRt">–</b></div>
 </div>
 <div class="tableWrap"><table><thead><tr><th data-t="exercise"></th><th class="n" data-t="doneCol"></th><th class="n" data-t="target"></th><th class="n" data-t="formCol"></th></tr></thead><tbody id="sRows"></tbody></table></div>
 <h3 style="margin-top:24px" data-t="musclesToday"></h3><div class="chips" id="sMus"></div>
 <h3 style="margin-top:16px" data-t="benefitsToday"></h3><div class="bens" id="sBens"></div>
 <p class="who" id="sTips"></p>
 <div class="go"><button class="primary" id="againBtn" data-t="again"></button><button id="homeBtn" data-t="home"></button></div>
</section>

<script>/* ===== DATA: i18n, tiers, phases, themes, poses ===== */
const U={
 pageTitle:{th:'โรงพยาบาลพหุภพ · ต้นแบบกิจกรรมออกกำลังกายและบริหารสมอง',en:'Multiverse Hospital · Exercise & Cognitive Movement Prototype'},
 brand:{th:'โรงพยาบาลพหุภพ',en:'Multiverse Hospital'},

 textSize:{th:'ตัวอักษรใหญ่ ก+',en:'Large Text A+'},
 heroKicker:{th:'โครงการโรงพยาบาลพหุภพเพื่อสุขภาพด้านการรู้คิดของผู้สูงอายุไทย',en:'Multiverse Hospital for Cognitive Health of Thai Older Adults'},
 title:{th:'ออกกำลังกายอย่างปลอดภัย ดูแลทั้งร่างกายและสมอง',en:'Safe daily movement for body & brain health'},
 lede:{th:'ต้นแบบกิจกรรมออกกำลังกายผ่านกล้องสำหรับผู้สูงอายุ ผสานท่ารำไทยประยุกต์บนเก้าอี้ การยืดเหยียด ฝึกทรงตัวลดเสี่ยงหกล้ม และกิจกรรมบริหารสมองแบบทำได้เองที่บ้าน',en:'A camera-guided exercise prototype for Thai older adults combining seated Applied Thai Dance, gentle stretching, fall-prevention balance and dual-task brain activities.'},
 trust1:{th:'ประมวลผลบนเครื่อง ไม่บันทึกใบหน้า (PDPA)',en:'On-device pose tracking · No video stored (PDPA)'},

const MOVES={L:K(SEAT,{aL:A.up}),R:K(SEAT,{aR:A.up}),B:K(SEAT,{aR:A.up,aL:A.up}),T:K(SEAT,{aR:A.side,aL:A.side})};

/* ---------- annual plan ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const allowed=(p,ti)=>(p.reps[ti]||0)>0;
function dayInfo(d){const phase=Math.min(5,Math.floor(d/61)), easyWeek=Math.floor(d/7)%4===3;
 return {d,phase,easyWeek,theme:THEMES[d%7],mult:PHASES[phase].m*(easyWeek?.8:1)};}
function dayPlan(d,tk){
 const ti=TIERS[tk].i, info=dayInfo(d), r=rng(d*7919+ti*104729+17);
 const used=new Set(), stretch=[], cardio=[];
 const sPool=shuffle(POSES.filter(p=>p.cat==='stretch'&&allowed(p,ti)),r);
 const sN=info.theme.stretchN||3;
 if(info.theme.id==='thai'||info.theme.id==='thaimix'){stretch.push('wrist');used.add('wrist');}
 for(const p of sPool){if(stretch.length>=sN)break;if(!used.has(p.id)){stretch.push(p.id);used.add(p.id);}}
 stretch.sort((a,b)=>(a==='neck'?-1:0)-(b==='neck'?-1:0));
 for(const [g,n] of info.theme.mix){
  const pool=shuffle(POSES.filter(p=>p.grp&&p.grp.includes(g)&&allowed(p,ti)&&!used.has(p.id)),r);
  for(const p of pool.slice(0,n)){cardio.push(p.id);used.add(p.id);}
  for(const fb of ['cardio','thai']){ if(pool.length>=n) break;
   const more=shuffle(POSES.filter(p=>p.grp&&p.grp.includes(fb)&&allowed(p,ti)&&!used.has(p.id)),r).slice(0,n-pool.length);
   for(const p of more){cardio.push(p.id);used.add(p.id);} pool.push(...more); }
 }
 const tgt=(id)=>{const p=POSE[id];let v=p.reps[ti];
  if(p.mode==='memory') return v;
  if(p.mode==='choice') return Math.max(6,Math.round(v*Math.min(info.mult,1.2)));
  v=Math.round(v*info.mult); return p.mode==='hold'?Math.max(8,v):Math.max(4,v);};
 const items=[...stretch.map(id=>({id,block:'stretch',target:tgt(id)})),...cardio.map(id=>({id,block:'cardio',target:tgt(id)}))];
 return {...info,mode:'daily',items};
}
function buildPlan(mode,d,tk){
 if(!mode||mode==='daily'||!GAME_MODE[mode]) return dayPlan(d,tk);
 const ti=TIERS[tk].i, info=dayInfo(d), r=rng(d*7919+ti*104729+mode.charCodeAt(0)*31);
 const m=GAME_MODE[mode];

  if(p.mode==='memory') return v;

/* ===== Unified High-Resolution Articulated Dancer for All Non-t1..t10 Exercises ===== */
const FIG=(()=>{
 const D2R=Math.PI/180;
 const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], scl=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
 const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
 const lerp=(a,b,t)=>a+(b-a)*t, lv=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
 function rot(v,s){let [x,y,z]=v,a=(s.twist||0)*D2R,c=Math.cos(a),n=Math.sin(a);[x,z]=[x*c+z*n,-x*n+z*c];
  a=(s.bend||0)*D2R;c=Math.cos(a);n=Math.sin(a);[y,z]=[y*c-z*n,y*n+z*c];
  a=(s.lean||0)*D2R;c=Math.cos(a);n=Math.sin(a);[x,y]=[x*c+y*n,-x*n+y*c];return [x,y,z];}
 function mixL(a,b,t,ks){const o={};for(const k of ks)o[k]=lv(a[k],b[k],t);o.h=t<.5?a.h:b.h;o.f=lerp(a.f||0,b.f||0,t);return o;}
 function specAt(keys,u){const n=keys.length;if(n===1)return keys[0];
  const x=u*n,i=Math.floor(x)%n,j=(i+1)%n;let t=x-Math.floor(x);t=t<.38?0:(t-.38)/.62;t=-(Math.cos(Math.PI*t)-1)/2;
  const a=keys[i],b=keys[j],o={};for(const k of ['hipY','hz','bend','lean','twist','tilt','shr'])o[k]=lerp(a[k]||0,b[k]||0,t);
  o.aR=mixL(a.aR,b.aR,t,['E','H']);o.aL=mixL(a.aL,b.aL,t,['E','H']);o.lR=mixL(a.lR,b.lR,t,['K','A']);o.lL=mixL(a.lL,b.lL,t,['K','A']);return o;}
 function skel(s){
  const hc=[0,s.hipY,s.hz||0],neck=add(hc,rot([0,.29,0],s)),head=add(neck,rot([0,.11,0],{bend:s.bend,lean:(s.lean||0)+(s.tilt||0)}));
  const P={hc,neck,head};
  for(const [sd,g] of [['R',-1],['L',1]]){
   const sh=add(hc,rot([g*.115,.275+(s.shr||0),0],s)),a=s['a'+sd];
   const E=rot([a.E[0]*g,a.E[1],a.E[2]],s),H=rot([a.H[0]*g,a.H[1],a.H[2]],s);
   const el=add(sh,scl(nrm(E),.17)),hd=add(el,scl(nrm(sub(H,E)),.16));
   const hj=add(hc,[g*.068,0,0]),l=s['l'+sd],Kv=[l.K[0]*g,l.K[1],l.K[2]],Av=[l.A[0]*g,l.A[1],l.A[2]];
   const kn=add(hj,scl(nrm(Kv),.25)),an=add(kn,scl(nrm(sub(Av,Kv)),.245)),f=l.f||0;
   Object.assign(P,{['sh'+sd]:sh,['el'+sd]:el,['hd'+sd]:hd,['ha'+sd]:a.h,['hj'+sd]:hj,['kn'+sd]:kn,['an'+sd]:an,['fp'+sd]:f});

 }
 function mapMudra(h){
  if(h==='w')return 'tang_wong';

  if(h==='k')return 'jeeb_kwum';
  if(h==='l')return 'jeeb_lor_kaew';
  if(h==='u')return 'open_up';
  if(h==='d')return 'open_down';
  if(h==='f')return 'fist';
  if(h==='r')return 'rest';

 }
 function draw(cv,keys,period,time,opt={}){
  const dpr=Math.min(3,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;if(W<10||H<10)return;
  const pw=Math.round(W*dpr),ph=Math.round(H*dpr);
  if(cv.width!==pw||cv.height!==ph){cv.width=pw;cv.height=ph;}
  const ctx=cv.getContext('2d');ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const pal=THAI_ART.getPalette();

  const breath=Math.sin((time||0)*0.0022)*0.004;
  const s=specAt(keys,(((Math.max(0,time||0)/1000)/Math.max(0.2,period||3))%1+1)%1);
  s.shr=(s.shr||0)+breath;

   const mx=p[0]*mSign,x=mx*cy+p[2]*sy,d=-mx*sy+p[2]*cy;
   return [cx+x*S,floorY-p[1]*S+d*0.14*S,d];
  };

  /* Sunlit floor & subtle studio grid */
  if(!compact){
   ctx.strokeStyle=pal.floorLine;ctx.lineWidth=1;
   for(let i=1;i<6;i++){const gx=(W/6)*i;ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,floorY);ctx.stroke();}
  }
  ctx.fillStyle=pal.floorFill;ctx.fillRect(0,floorY,W,H-floorY);
  ctx.beginPath();ctx.moveTo(0,floorY);ctx.lineTo(W,floorY);ctx.strokeStyle=pal.floorLine;ctx.lineWidth=1.5;ctx.stroke();
  const fc=pr([0,0,0.08]);
  ctx.fillStyle=pal.shadow;ctx.beginPath();ctx.ellipse(fc[0],fc[1]+2,0.28*S,0.042*S,0,0,Math.PI*2);ctx.fill();

  const items=[];
  if(chair){
   const q=(x,y,z)=>pr([x,y,z]);
   items.push({d:-0.35,f:()=>{
    ctx.strokeStyle=pal.chairWoodDark;ctx.lineWidth=Math.max(2,0.022*S);ctx.lineCap='round';
    for(const [x,z] of [[-0.15,-0.13],[0.15,-0.13],[-0.15,0.12],[0.15,0.12]]){
     const a=q(x,0.26,z),b=q(x,0,z);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    }
    for(const x of [-0.15,0.15]){
     const a=q(x,0.26,-0.13),b=q(x,0.59,-0.15);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    }
    const bp=[q(-0.15,0.42,-0.14),q(0.15,0.42,-0.14),q(0.15,0.58,-0.15),q(-0.15,0.58,-0.15)];
    ctx.fillStyle=pal.chairPad;ctx.strokeStyle=pal.chairEdge;ctx.lineWidth=1.4;
    ctx.beginPath();bp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke();
    const sp=[q(-0.165,0.265,-0.14),q(0.165,0.265,-0.14),q(0.165,0.265,0.135),q(-0.165,0.265,0.135)];
    ctx.fillStyle=pal.chairPadHi;ctx.beginPath();sp.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.stroke();
   }});
  }

  /* Legs + Shoes */
  for(const [sd,sg] of [['R',-1],['L',1]]){
   const hj=pr(P['hj'+sd]),kn=pr(P['kn'+sd]),an=pr(P['an'+sd]),fp=P['fp'+sd]||0;
   items.push({d:(hj[2]+kn[2])*0.5,f:()=>THAI_ART.drawShadedCapsule(ctx,hj[0],hj[1],kn[0],kn[1],0.044*S,0.036*S,pal.pantsHi,pal.pantsShadow,pal.pantsOutline,1.1)});

   items.push({d:an[2]+0.02,f:()=>THAI_ART.drawShoe(ctx,an[0],an[1],fp,sg*mSign,Math.max(0.15,P['an'+sd][2]),S*1.04,pal)});
  }

  /* Torso + Thai Gold Trim + Neck + Sculpted Smiling Face */
  const shR=pr(P.shR),shL=pr(P.shL),hjR=pr(P.hjR),hjL=pr(P.hjL),nk=pr(P.neck),hd=pr(P.head);
  items.push({d:(shR[2]+shL[2]+hjR[2]+hjL[2])*0.25-0.01,f:()=>{
   const midShX=(shR[0]+shL[0])*0.5,midShY=(shR[1]+shL[1])*0.5;

   /* Thai gold hem trim & neckline placket */
   ctx.strokeStyle=pal.shirtGold;ctx.lineWidth=Math.max(1.5,0.008*S);

   ctx.quadraticCurveTo(midHpX,midHpY+0.028*S,hjL[0]+(hjL[0]-midHpX)*0.18,hjL[1]+0.012*S);ctx.stroke();
   ctx.beginPath();ctx.moveTo(midShX,midShY-0.015*S);ctx.lineTo(midShX+(midHpX-midShX)*0.36,midShY+(midHpY-midShY)*0.36);ctx.stroke();

   }});
   items.push({d:(el[2]+wr[2])*0.5+0.025,f:()=>{
    THAI_ART.drawShadedCapsule(ctx,el[0],el[1],wr[0],wr[1],0.023*S,0.017*S,pal.skinHi,pal.skinShadow,pal.skinOutline,1);

  }
  ctx.restore();
 }

 const ease=x=>-(Math.cos(Math.PI*x)-1)/2;
 const lerp=(a,b,t)=>a+(b-a)*t;
 const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
 function rrect(ctx,x,y,w,h,r){if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}

 function samplePose(poseDef,uNorm){
  const kfs=poseDef.keyframes,u=((uNorm%1)+1)%1;
  let i=0;while(i<kfs.length-2&&u>=kfs[i+1].t)i++;
  const k0=kfs[i],k1=kfs[i+1],span=Math.max(1e-6,k1.t-k0.t),rawT=Math.max(0,Math.min(1,(u-k0.t)/span));
  const isHold=k0.pose.holdSec>0&&k1.pose.holdSec>0&&k0.pose.stepIdx===k1.pose.stepIdx;
  const e=isHold?rawT:ease(rawT),a=k0.pose,b=k1.pose,pick=rawT<0.5?a:b;
  return {
   stand:lerp(a.stand,b.stand,e),torsoTwist:lerp(a.torsoTwist,b.torsoTwist,e),torsoArch:lerp(a.torsoArch,b.torsoArch,e),
   torsoLeanX:lerp(a.torsoLeanX,b.torsoLeanX,e),headTurn:lerp(a.headTurn,b.headTurn,e),headTilt:lerp(a.headTilt,b.headTilt,e),
   rElbow:lerp3(a.rElbow,b.rElbow,e),rWrist:lerp3(a.rWrist,b.rWrist,e),rHandAngle:lerp(a.rHandAngle,b.rHandAngle,e),rMudra:rawT<0.35?a.rMudra:b.rMudra,
   lElbow:lerp3(a.lElbow,b.lElbow,e),lWrist:lerp3(a.lWrist,b.lWrist,e),lHandAngle:lerp(a.lHandAngle,b.lHandAngle,e),lMudra:rawT<0.35?a.lMudra:b.lMudra,
   rKnee:lerp3(a.rKnee,b.rKnee,e),rAnkle:lerp3(a.rAnkle,b.rAnkle,e),rFootPitch:lerp(a.rFootPitch,b.rFootPitch,e),
   lKnee:lerp3(a.lKnee,b.lKnee,e),lAnkle:lerp3(a.lAnkle,b.lAnkle,e),lFootPitch:lerp(a.lFootPitch,b.lFootPitch,e),
   stepIdx:pick.stepIdx,phaseText:pick.phaseText,
   holdSec:isHold?a.holdSec:0,holdProgress:isHold?lerp(a.holdProgress||0,b.holdProgress||1,rawT):0,
   activeParts:pick.activeParts||[]
  };
 }

 function drawDetailInset(ctx,W,H,poseDef,s,pal,lang='th'){

  if(type==='mudra'){THAI_ART.drawHandInset(ctx,W,H,s.rMudra,s.lMudra,s.rHandAngle,s.lHandAngle,pal,lang);return;}
  const boxW=Math.min(156,Math.max(122,W*0.36)),boxH=108,x=W-boxW-8,y=8;
  ctx.save();
  ctx.fillStyle='rgba(255,253,245,0.96)';ctx.beginPath();THAI_ART.rrect(ctx,x,y,boxW,boxH,13);ctx.fill();
  ctx.strokeStyle='#F5B800';ctx.lineWidth=1.8;ctx.stroke();
  ctx.fillStyle=pal.fg;ctx.font='700 10px "IBM Plex Sans Thai",Sarabun,system-ui,sans-serif';ctx.textAlign='left';
  if(type==='feet'){
   ctx.fillText(lang==='th'?'มุมมองข้าง (เท้า)':'FOOT DETAIL (SIDE)',x+9,y+16);
   const fx=x+boxW*0.52,fy=y+boxH-20;
   ctx.strokeStyle=pal.border;ctx.beginPath();ctx.moveTo(x+14,fy);ctx.lineTo(x+boxW-14,fy);ctx.stroke();
   ctx.save();const pitch=s.rFootPitch;
   if(pitch>=0){ctx.translate(fx+18,fy);ctx.rotate(-pitch*0.58);ctx.translate(-18,0);}

   ctx.strokeStyle=pal.pants;ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-14,-6);ctx.lineTo(-14,-34);ctx.stroke();
   ctx.fillStyle=pal.shoe;ctx.strokeStyle=pal.shoeSole;ctx.lineWidth=1.6;ctx.beginPath();THAI_ART.rrect(ctx,-22,-13,46,13,[6,10,3,3]);ctx.fill();ctx.stroke();
   ctx.restore();
   ctx.fillStyle=pal.primary;ctx.font='700 10px "IBM Plex Sans Thai",Sarabun,system-ui,sans-serif';ctx.textAlign='center';
   ctx.fillText(pitch>0.35?'เขย่งปลายเท้า • Heel Up':(pitch<-0.35?'กระดกปลายเท้า • Toe Up':'Neutral'),x+boxW/2,y+boxH-6);
  }else if(type==='sideBack'){
   ctx.fillText(lang==='th'?'มุมมองข้าง (แผ่นหลัง)':'SIDE PROFILE (SPINE)',x+9,y+16);
   const cx=x+boxW*0.45,cy=y+76,arch=s.torsoArch;
   ctx.strokeStyle=pal.chairWoodDark;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(cx-16,cy-26);ctx.lineTo(cx-16,cy);ctx.lineTo(cx+12,cy);ctx.stroke();
   const shX=cx-4+(-arch*9),shY=cy-30+(arch*2);
   ctx.strokeStyle=pal.shirt;ctx.lineWidth=7.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-5,cy-2);ctx.quadraticCurveTo(cx-6-arch*8,cy-16,shX,shY);ctx.stroke();
   ctx.fillStyle=pal.skin;ctx.beginPath();ctx.arc(shX+1,shY-11,7,0,Math.PI*2);ctx.fill();
   const armAngle=lerp(0.15,Math.PI-0.35,(arch+1)/2);
   ctx.strokeStyle=pal.goldGlow;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(shX,shY+2);ctx.lineTo(shX+Math.cos(armAngle)*28,shY+Math.sin(armAngle)*28);ctx.stroke();
   ctx.fillStyle=pal.primary;ctx.font='700 10px "IBM Plex Sans Thai",Sarabun,system-ui,sans-serif';ctx.textAlign='center';
   ctx.fillText(arch<-0.2?'เหยียดหน้า • Forward':(arch>0.3?'แอ่นอก • Back Open':'วาดแขน • Sweep'),x+boxW/2,y+boxH-6);
  }else if(type==='sideKnee'){
   ctx.fillText(lang==='th'?'มุมมองข้าง (เข่า)':'SIDE PROFILE (KNEE)',x+9,y+16);
   const cx=x+boxW*0.38,cy=y+68,ext=Math.max(0,Math.max(s.rAnkle[2],s.lAnkle[2])-0.15)/0.63;
   ctx.strokeStyle=pal.chairWoodDark;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(cx-14,cy-22);ctx.lineTo(cx-14,cy+20);ctx.moveTo(cx-14,cy);ctx.lineTo(cx+12,cy);ctx.stroke();
   ctx.strokeStyle=pal.pants;ctx.lineWidth=6.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-4,cy-3);ctx.lineTo(cx+18,cy-3);ctx.stroke();
   const shinAng=lerp(Math.PI/2,-0.05,ext);
   ctx.strokeStyle=pal.primary;ctx.lineWidth=5.5;ctx.beginPath();ctx.moveTo(cx+18,cy-3);ctx.lineTo(cx+18+Math.cos(shinAng)*26,cy-3+Math.sin(shinAng)*26);ctx.stroke();

   ctx.fillText(ext>0.4?'เหยียดตรง • Straight':'งอเข่า • Bent',x+boxW/2,y+boxH-6);
  }else if(type==='sideStand'){
   ctx.fillText(lang==='th'?'นั่ง ↔ ลุกยืน':'SIT ↔ STAND',x+9,y+16);
   const cx=x+boxW*0.48,fy=y+86,st=s.stand;
   ctx.strokeStyle=pal.chairWoodDark;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(cx-24,fy-36);ctx.lineTo(cx-24,fy);ctx.moveTo(cx-24,fy-18);ctx.lineTo(cx-4,fy-18);ctx.stroke();
   const hipX=lerp(cx-14,cx+6,st),hipY=lerp(fy-20,fy-32,st),kneeX=lerp(cx+4,cx+8,st),kneeY=lerp(fy-18,fy-16,st),shX=hipX,shY=hipY-22;
   ctx.strokeStyle=pal.pants;ctx.lineWidth=5.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(hipX,hipY);ctx.lineTo(kneeX,kneeY);ctx.lineTo(cx+8,fy-2);ctx.stroke();
   ctx.strokeStyle=pal.shirt;ctx.lineWidth=6.5;ctx.beginPath();ctx.moveTo(hipX,hipY);ctx.lineTo(shX,shY);ctx.stroke();
   ctx.fillStyle=pal.skin;ctx.beginPath();ctx.arc(shX+1,shY-8,5.5,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=pal.primary;ctx.font='700 10px "IBM Plex Sans Thai",Sarabun,system-ui,sans-serif';ctx.textAlign='center';
   ctx.fillText(st>0.5?'ลุกยืน • Standing':'นั่งพัก • Seated',x+boxW/2,y+boxH-6);
  }
  ctx.restore();
 }

 function draw(cv,id,timeMs,opt={}){
  const poseDef=DEFS[id];if(!poseDef)return null;
  const W=cv.clientWidth,H=cv.clientHeight;if(W<10||H<10)return null;
  const dpr=Math.min(window.devicePixelRatio||1,3),w=Math.round(W*dpr),h=Math.round(H*dpr);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  const ctx=cv.getContext('2d');ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const {mirror=false,showGuides=true,compact=true,slow=1,lang='th'}=opt;
  const pal=THAI_ART.getPalette();
  const dur=poseDef.duration*(poseDef.id===6?1:slow);
  const uNorm=(((Math.max(0,timeMs)/1000)/dur)%1+1)%1;
  const s=samplePose(poseDef,uNorm);

  if(!compact){
   ctx.strokeStyle=pal.floorLine;ctx.lineWidth=1;
   for(let i=1;i<6;i++){const gx=(W/6)*i;ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H*0.88);ctx.stroke();}
  }

  const isStandingPose=poseDef.id===10;
  const scale=Math.min(W*0.92,H*(isStandingPose?0.80:0.90));
  const cx=compact?W*0.50:W*0.42;
  const floorY=H*(isStandingPose?0.92:0.90);
  const mSign=mirror?-1:1;
  const toX=nx=>cx+nx*mSign*scale,toY=ny=>floorY-ny*scale;

  ctx.fillStyle=pal.floorFill;ctx.fillRect(0,floorY,W,H-floorY);
  ctx.beginPath();ctx.moveTo(0,floorY);ctx.lineTo(W,floorY);ctx.strokeStyle=pal.floorLine;ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,floorY+2,scale*0.23,scale*0.026,0,0,Math.PI*2);ctx.fillStyle=pal.shadow;ctx.fill();

  /* Warm teak-and-slate chair */
  const seatY=toY(0.28),backTopY=toY(0.55),chairHalfW=scale*0.145;
  ctx.strokeStyle=pal.chairWoodDark;ctx.lineWidth=Math.max(1.8,scale*0.012);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-chairHalfW*0.82,seatY);ctx.lineTo(cx-chairHalfW*0.86,backTopY);
  ctx.moveTo(cx+chairHalfW*0.82,seatY);ctx.lineTo(cx+chairHalfW*0.86,backTopY);ctx.stroke();
  ctx.fillStyle=pal.chairPad;ctx.strokeStyle=pal.chairEdge;ctx.lineWidth=1.3;
  ctx.beginPath();THAI_ART.rrect(ctx,cx-chairHalfW*0.9,backTopY,chairHalfW*1.8,(seatY-backTopY)*0.56,6);ctx.fill();ctx.stroke();
  ctx.strokeStyle=pal.chairWood;ctx.lineWidth=Math.max(1.8,scale*0.012);
  [[-0.92,-1.0],[0.92,1.0],[-0.72,-0.76],[0.72,0.76]].forEach(([tx,bx],idx)=>{
   ctx.beginPath();ctx.moveTo(cx+chairHalfW*tx,seatY+3);ctx.lineTo(cx+chairHalfW*bx,floorY-(idx>=2?scale*0.02:0));ctx.stroke();
  });
  ctx.fillStyle=pal.chairPadHi;ctx.strokeStyle=pal.chairEdge;ctx.lineWidth=1.3;
  ctx.beginPath();THAI_ART.rrect(ctx,cx-chairHalfW*1.05,seatY-scale*0.014,chairHalfW*2.1,scale*0.032,6);ctx.fill();ctx.stroke();

  const hipLift=s.stand*0.21,pelvisY=0.305+hipLift,pelvisX=s.torsoLeanX*0.15;
  const twistCos=Math.cos(s.torsoTwist*0.72),archLift=s.torsoArch*0.018;
  const shoulderY=pelvisY+0.285+archLift,shoulderCenterX=pelvisX+s.torsoLeanX,halfShoulderW=0.125*(0.68+0.32*twistCos);
  const rHip=[pelvisX-0.072,pelvisY],lHip=[pelvisX+0.072,pelvisY];
  const rShoulder=[shoulderCenterX-halfShoulderW,shoulderY],lShoulder=[shoulderCenterX+halfShoulderW,shoulderY];
  const neckPos=[shoulderCenterX+s.torsoLeanX*0.2,shoulderY+0.032];
  const headPos=[shoulderCenterX+s.torsoLeanX*0.35+s.headTilt*0.025,shoulderY+0.135+archLift*0.5];
  const armOffsetY=poseDef.id===10?0:hipLift;
  const rElbow=[s.rElbow[0],s.rElbow[1]+armOffsetY,s.rElbow[2]],rWrist=[s.rWrist[0],s.rWrist[1]+armOffsetY,s.rWrist[2]];
  const lElbow=[s.lElbow[0],s.lElbow[1]+armOffsetY,s.lElbow[2]],lWrist=[s.lWrist[0],s.lWrist[1]+armOffsetY,s.lWrist[2]];

  function drawArm(side,sh,el,wr,handAngle,mudra){
   const zEl=1+el[2]*0.1,zWr=1+wr[2]*0.14;
   const sx=toX(sh[0]),sy=toY(sh[1]),ex=toX(el[0]),ey=toY(el[1]),wx=toX(wr[0]),wy=toY(wr[1]);
   THAI_ART.drawShadedCapsule(ctx,sx,sy,ex,ey,scale*0.029*zEl,scale*0.024*zEl,pal.skinHi,pal.skinShadow,pal.skinOutline,1);
   const slx=lerp(sx,ex,0.52),sly=lerp(sy,ey,0.52);
   THAI_ART.drawShadedCapsule(ctx,sx,sy,slx,sly,scale*0.036,scale*0.031,pal.shirtHi,pal.shirtDark,pal.shirtDark,1);
   const a2=Math.atan2(ey-sy,ex-sx)+Math.PI/2;
   ctx.strokeStyle=pal.shirtGold;ctx.lineWidth=Math.max(1.2,scale*0.0055);
   ctx.beginPath();ctx.moveTo(slx-Math.cos(a2)*scale*0.029,sly-Math.sin(a2)*scale*0.029);ctx.lineTo(slx+Math.cos(a2)*scale*0.029,sly+Math.sin(a2)*scale*0.029);ctx.stroke();
   THAI_ART.drawShadedCapsule(ctx,ex,ey,wx,wy,scale*0.023*zEl,scale*0.017*zWr,pal.skinHi,pal.skinShadow,pal.skinOutline,1);
   THAI_ART.drawThaiHand(ctx,wx,wy,handAngle*mSign,mudra,side*mSign,scale*zWr,pal,{rawSide:side<0?'R':'L'});
  }
  if(rWrist[2]<-0.05)drawArm(-1,rShoulder,rElbow,rWrist,s.rHandAngle,s.rMudra);
  if(lWrist[2]<-0.05)drawArm(1,lShoulder,lElbow,lWrist,s.lHandAngle,s.lMudra);

  function drawLeg(side,hip,knee,ankle,footPitch){
   const kZ=1+(knee[2]-0.15)*0.18,aZ=1+(ankle[2]-0.15)*0.2;
   THAI_ART.drawShadedCapsule(ctx,toX(hip[0]),toY(hip[1]),toX(knee[0]),toY(knee[1]),scale*0.044,scale*0.037*kZ,pal.pantsHi,pal.pantsShadow,pal.pantsOutline,1.1);
   THAI_ART.drawShadedCapsule(ctx,toX(knee[0]),toY(knee[1]),toX(ankle[0]),toY(ankle[1]),scale*0.034*kZ,scale*0.024*aZ,pal.pantsHi,pal.pantsShadow,pal.pantsOutline,1.1);
   THAI_ART.drawShoe(ctx,toX(ankle[0]),toY(ankle[1]),footPitch,side*mSign,ankle[2],scale,pal);
  }
  drawLeg(-1,rHip,s.rKnee,s.rAnkle,s.rFootPitch);
  drawLeg(1,lHip,s.lKnee,s.lAnkle,s.lFootPitch);

  const waistHalfW=0.092*(0.76+0.24*twistCos);
  const tg=ctx.createLinearGradient(toX(rShoulder[0]),toY(shoulderY),toX(lShoulder[0]),toY(pelvisY));
  tg.addColorStop(0,pal.shirtHi);tg.addColorStop(0.55,pal.shirt);tg.addColorStop(1,pal.shirtDark);
  ctx.beginPath();ctx.moveTo(toX(rShoulder[0]),toY(rShoulder[1]+0.01));
  ctx.quadraticCurveTo(toX(shoulderCenterX),toY(shoulderY+0.035),toX(lShoulder[0]),toY(lShoulder[1]+0.01));
  ctx.lineTo(toX(pelvisX+waistHalfW),toY(pelvisY-0.015));
  ctx.quadraticCurveTo(toX(pelvisX),toY(pelvisY-0.03),toX(pelvisX-waistHalfW),toY(pelvisY-0.015));
  ctx.closePath();ctx.fillStyle=tg;ctx.fill();ctx.strokeStyle=pal.shirtDark;ctx.lineWidth=1.2;ctx.stroke();

  const placketShift=s.torsoTwist*0.055;
  ctx.strokeStyle=pal.shirtGold;ctx.lineWidth=Math.max(1.4,scale*0.0065);
  ctx.beginPath();ctx.moveTo(toX(pelvisX-waistHalfW*0.92),toY(pelvisY-0.012));
  ctx.quadraticCurveTo(toX(pelvisX),toY(pelvisY-0.025),toX(pelvisX+waistHalfW*0.92),toY(pelvisY-0.012));ctx.stroke();
  ctx.beginPath();ctx.moveTo(toX(shoulderCenterX+placketShift),toY(shoulderY+0.015));
  ctx.lineTo(toX(shoulderCenterX+placketShift*0.85),toY(shoulderY-0.088));ctx.stroke();

  if(s.torsoArch>0.35&&showGuides){
   ctx.save();ctx.strokeStyle=pal.goldGlow;ctx.globalAlpha=Math.min(0.75,s.torsoArch*0.7);ctx.lineWidth=2.2;
   ctx.beginPath();ctx.arc(toX(shoulderCenterX),toY(shoulderY-0.06),scale*0.07,-Math.PI*0.78,-Math.PI*0.22);ctx.stroke();ctx.restore();
  }

  THAI_ART.drawShadedCapsule(ctx,toX(neckPos[0]),toY(neckPos[1]-0.02),toX(headPos[0]),toY(headPos[1]-0.045),scale*0.024,scale*0.021,pal.skin,pal.skinShadow,pal.skinOutline,0.85);
  THAI_ART.drawFace(ctx,toX(headPos[0]),toY(headPos[1]),scale*0.065,s.headTurn,s.headTilt,mSign,pal);

  const frontArms=[];
  if(rWrist[2]>=-0.05)frontArms.push({z:rWrist[2],fn:()=>drawArm(-1,rShoulder,rElbow,rWrist,s.rHandAngle,s.rMudra)});
  if(lWrist[2]>=-0.05)frontArms.push({z:lWrist[2],fn:()=>drawArm(1,lShoulder,lElbow,lWrist,s.lHandAngle,s.lMudra)});
  frontArms.sort((a,b)=>a.z-b.z).forEach(item=>item.fn());

  if(showGuides){
   const pulse=0.5+0.5*Math.sin(performance.now()*0.006);
   const ptMap={rWrist:[toX(rWrist[0]),toY(rWrist[1])],lWrist:[toX(lWrist[0]),toY(lWrist[1])],rKnee:[toX(s.rKnee[0]),toY(s.rKnee[1])],lKnee:[toX(s.lKnee[0]),toY(s.lKnee[1])],rAnkle:[toX(s.rAnkle[0]),toY(s.rAnkle[1])],lAnkle:[toX(s.lAnkle[0]),toY(s.lAnkle[1])],torso:[toX(shoulderCenterX),toY(shoulderY-0.11)]};
   (s.activeParts||[]).forEach(part=>{
    const pt=ptMap[part];if(!pt)return;
    ctx.save();ctx.beginPath();ctx.arc(pt[0],pt[1],(compact?5:11)+pulse*(compact?2.5:5),0,Math.PI*2);
    ctx.strokeStyle=part.startsWith('r')?pal.cuffR:(part.startsWith('l')?pal.cuffL:pal.guideColor);
    ctx.globalAlpha=0.25+(1-pulse)*0.35;ctx.lineWidth=compact?1.5:2;ctx.stroke();ctx.restore();
   });
   if(!compact){
    ctx.save();ctx.strokeStyle=pal.guideColor;ctx.fillStyle=pal.guideColor;ctx.lineWidth=2;
    if(poseDef.id===3&&Math.abs(s.torsoTwist)>0.2){
     const dir=Math.sign(s.torsoTwist)*mSign,ay=toY(0.39);
     ctx.beginPath();ctx.arc(cx,ay,scale*0.14,Math.PI*0.2,Math.PI*0.8);ctx.stroke();
     ctx.beginPath();ctx.arc(cx+dir*scale*0.12,ay+scale*0.075,3.5,0,Math.PI*2);ctx.fill();
    }
    if(poseDef.id===10){
     const ax=cx-scale*0.26,arrowTop=toY(0.76),arrowBot=toY(0.42);
     ctx.globalAlpha=0.55;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(ax,arrowBot);ctx.lineTo(ax,arrowTop);ctx.stroke();ctx.setLineDash([]);
     const curY=lerp(arrowBot,arrowTop,s.stand);ctx.globalAlpha=0.95;ctx.beginPath();ctx.arc(ax,curY,5,0,Math.PI*2);ctx.fill();
     ctx.font='700 11px "IBM Plex Sans Thai",Sarabun,system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(s.stand>0.5?'STAND':'SIT',ax,curY-10);
    }
    ctx.restore();
   }
  }

  if(poseDef.id===6&&s.holdSec>0&&W>=110){
   const ringR=compact?15:26;
   const rx=compact?W-22:cx+(s.stepIdx===0?1:-1)*mSign*scale*0.25;
   const ry=compact?22:toY(0.28);
   const secDisplay=Math.min(5,Math.floor(s.holdProgress*5)+1);
   ctx.save();ctx.beginPath();ctx.arc(rx,ry,ringR,0,Math.PI*2);ctx.fillStyle=pal.card;ctx.globalAlpha=0.94;ctx.fill();
   ctx.globalAlpha=1;ctx.strokeStyle=pal.border;ctx.lineWidth=compact?2.5:4;ctx.stroke();
   ctx.beginPath();ctx.arc(rx,ry,ringR,-Math.PI/2,-Math.PI/2+s.holdProgress*Math.PI*2);
   ctx.strokeStyle=pal.goldGlow;ctx.lineWidth=compact?2.5:4;ctx.lineCap='round';ctx.stroke();
   ctx.fillStyle=pal.fg;ctx.font=`700 ${compact?11:14}px Sarabun,system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText(secDisplay+'s',rx,ry-(compact?0:4));
   if(!compact){ctx.fillStyle=pal.muted;ctx.font='600 9px Sarabun,system-ui,sans-serif';ctx.fillText('HOLD',rx,ry+11);}
   ctx.restore();
  }

  if(!compact&&W>=215)drawDetailInset(ctx,W,H,poseDef,s,pal,lang);
  ctx.restore();
  return s;
 }

 function drawMudraIcon(cv,mudraKey){
  const dpr=Math.min(window.devicePixelRatio||1,3),W=56,H=56;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const pal=THAI_ART.getPalette(),cy=(mudraKey==='jeeb_kwum'||mudraKey==='jeeb_song_lang'||mudraKey==='rest')?18:42;
  const cx=(mudraKey==='open_up'||mudraKey==='open_down'||mudraKey==='open_down_flick')?18:27;
  THAI_ART.drawThaiHand(ctx,cx,cy,0,mudraKey,1,330,pal,{handScale:0.066,noCuff:true});
 }

 return {has:id=>!!DEFS[id],get:id=>DEFS[id],draw,drawMudraIcon,MUDRA_INFO};
})();
</script>

<script type="module">{
const MP="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL="https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
const $=id=>document.getElementById(id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('mh-ex-lang')||store.get('pp2-lang')||'th', tierKey=store.get('mh-ex-tier')||store.get('pp2-tier'), manualBig=store.get('mh-ex-big'), gameMode=store.get('mh-ex-mode')||'daily', gameMirror=false, soundOn=true, audio=null, landmarker=null, stream=null, raf=0, S=null, plan=null;
if(!GAME_MODE[gameMode]) gameMode='daily';
const tx=o=>o==null?'':typeof o==='string'?o:(o[lang]??o.en);
const t=(k,vars)=>{let s=tx(U[k]);if(vars)for(const [a,b] of Object.entries(vars))s=s.replace('{'+a+'}',b);return s;};
const DAY=86400000, mid=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
let start=store.get('mh-ex-start')||store.get('pp2-start'); if(!start){start=mid();store.set('mh-ex-start',start);}
const todayAbs=()=>Math.max(0,Math.round((mid()-start)/DAY));
let viewAbs=todayAbs();
const doneMap=()=>store.get('mh-ex-done')||store.get('pp2-done')||{};
const tk=()=>tierKey||'b';
const fmtDate=abs=>new Date(start+abs*DAY).toLocaleDateString(lang==='th'?'th-TH':'en-GB',{weekday:'short',day:'numeric',month:'short'});
const targetTxt=(p,n)=>p.mode==='hold'?`${n} ${t('sec')}`:p.mode==='choice'?`${n} ${t('trials')}`:p.mode==='memory'?`${n} ${t('rounds')}`:`${n} ${t('reps')}`;

/* ---------- static text ---------- */
function applyTextSize(){
 const big=manualBig!==null?!!manualBig:!!(tierKey&&TIERS[tierKey].big);
 document.body.classList.toggle('big',big);
 $('bigBtn').setAttribute('aria-pressed',String(big));
}
function applyLang(){
 document.documentElement.lang=lang;
 document.title=t('pageTitle');
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
 document.querySelectorAll('[data-th]').forEach(el=>el.innerHTML=t(el.dataset.th));
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 $('age').placeholder=t('agePh'); $('soundBtn').textContent=soundOn?t('voiceOn'):t('voiceOff');
 if(S) $('pauseBtn').textContent=S.paused?t('resume'):t('pause');
 validate();
}
function renderAll(){applyLang();renderTiers();renderModes();renderDay();renderYear();renderBens();}

/* ---------- game modes ---------- */
function renderModes(){
 const el=$('modePicker'); if(!el) return;
 el.innerHTML=GAME_MODES.map(m=>`<button type="button" class="modeCard" data-mode="${m.id}" style="--c:${m.c}" aria-pressed="${m.id===gameMode}"><span class="modeIco" aria-hidden="true">${m.ico}</span><b>${tx(m.name)}</b><span>${tx(m.desc)}</span></button>`).join('');
}
function pickMode(m){if(!GAME_MODE[m])return;gameMode=m;store.set('mh-ex-mode',m);renderModes();renderDay();}

/* ---------- tiers ---------- */
function renderTiers(){
 $('tiers').innerHTML=Object.entries(TIERS).map(([k,v])=>`<button class="tier" data-k="${k}" style="--c:${v.c}" aria-pressed="${k===tierKey}"><b>${tx(v.age)}</b><span>${tx(v.name)}</span></button>`).join('');
 applyTextSize(); validate();
}
function pick(k){tierKey=k;store.set('mh-ex-tier',k);renderTiers();renderDay();}
function validate(){
 const checked=$('c1').checked&&$('c2').checked&&$('c3').checked;
 const ok=!!(tierKey&&checked);
 $('startBtn').disabled=!ok;
 const rh=$('readyHint');
 if(rh){rh.textContent=ok?t('readyOk'):(!tierKey?t('readyNeedAge'):t('readyNeedCheck'));rh.classList.toggle('ok',ok);}
}

/* ---------- today ---------- */
function moveRow(it){const p=POSE[it.id],c=CATC[p.cat];
 const thumb=(!THAI_ANIM.has(p.id)&&typeof PHOTOS!=='undefined'&&PHOTOS[p.id])?`<img class="ph" data-ph="${p.id}" src="${PHOTOS[p.id][0]}" alt="${tx(p.name)}">`:`<canvas data-pose="${p.id}" aria-hidden="true"></canvas>`;
 return `<li class="mv" style="--c:${c}">${thumb}<div><b>${tx(p.name)}</b><small><span class="chip soft" style="--c:${c}">${t('cat_'+p.cat)}</span> ${targetTxt(p,it.target)} · ${t('mode_'+p.mode)}</small><small>${tx(p.mus).slice(0,3).join(' · ')}</small></div><button data-detail="${p.id}">${t('view')}</button></li>`;}
function renderDay(){
 const d=viewAbs%365; plan=buildPlan(gameMode,d,tk()); const th=plan.theme, ph=PHASES[plan.phase], isDaily=gameMode==='daily';
 $('dayChip').style.setProperty('--c',th.c);
 $('dayChip').textContent=isDaily?((viewAbs===todayAbs()?t('todayTag')+' · ':'')+fmtDate(viewAbs)):(GAME_MODE[gameMode].ico+' '+t('modeBadge'));
 $('phaseChip').classList.toggle('hide',!isDaily);
 $('phaseChip').style.setProperty('--c',ph.c); $('phaseChip').textContent=t('phase')+' '+(plan.phase+1)+' · '+tx(ph.name);
 $('easyChip').classList.toggle('hide',!isDaily||!plan.easyWeek); $('easyChip').textContent=t('recovery');
 $('dayNav').classList.toggle('hide',!isDaily);
 $('dayTitle').textContent=tx(th.name); $('dayTitle').style.color=th.c;
 const minsTxt=t('mins',{m:planMinutes(plan,tk())}), cntTxt=t('movesCount',{n:plan.items.length});
 $('dayMeta').textContent=isDaily?(t('dayOf',{d:d+1})+(viewAbs>=365?' · '+t('year',{y:Math.floor(viewAbs/365)+1}):'')+' · '+cntTxt+' · '+minsTxt):(tx(GAME_MODE[gameMode].desc)+' · '+cntTxt+' · '+minsTxt);
 const p1=plan.items.filter(i=>i.block==='stretch'), p2=plan.items.filter(i=>i.block==='cardio');
 $('part1Wrap').classList.toggle('hide',!p1.length); $('list1').innerHTML=p1.map(moveRow).join('');
 $('part2Wrap').classList.toggle('hide',!p2.length); $('list2').innerHTML=p2.map(moveRow).join('');
 $('todayBtn').disabled=viewAbs===todayAbs(); $('prevDay').disabled=viewAbs===0;
 const dm=doneMap(), n=Object.keys(dm).length; let s=0,a=todayAbs(); if(!dm[a]) a--; while(a>=0&&dm[a]){s++;a--;}
 $('doneLine').textContent=t('doneDays',{n,s})+(dm[viewAbs]?' · ✓ '+dm[viewAbs]:'');
 if($('rDays')){$('rDays').textContent=n; $('rStreak').textContent=s; $('rPhase').textContent=`${t('phase')} ${plan.phase+1} · ${tx(ph.name)}`;}
 renderYear();
}

/* ---------- year ribbon ---------- */
function renderYear(){
 const base=Math.floor(viewAbs/365)*365, today=todayAbs(), dm=doneMap(), curPhase=Math.min(5,Math.floor((viewAbs%365)/61));
 $('phaseBar').innerHTML=PHASES.map((p,i)=>`<div style="--c:${p.c}" class="${i===curPhase?'now':''}"><b>${t('phase')} ${i+1} · ×${p.m}</b>${tx(p.name)}</div>`).join('');
 let h='';
 for(let m=0;m<12;m++){const a=Math.floor(m*365/12),b=Math.floor((m+1)*365/12);let dots='';
  for(let d=a;d<b;d++){const abs=base+d,inf=dayInfo(d);
   dots+=`<button class="dot${dm[abs]?' done':''}${abs===today?' today':''}${abs===viewAbs?' view':''}${inf.easyWeek?' easy':''}" style="--c:${inf.theme.c}" data-abs="${abs}" aria-label="${t('dayOf',{d:d+1})} · ${tx(inf.theme.name)}" title="${t('dayOf',{d:d+1})} · ${tx(inf.theme.name)}"></button>`;}
  h+=`<div class="mrow"><span>${lang==='th'?'เดือน':'Month'} ${m+1}</span><div class="dots">${dots}</div></div>`;}
 $('year').innerHTML=h;
 $('week').innerHTML=THEMES.map((th,i)=>`<div style="--c:${th.c}">${tx(th.name)}<small>${lang==='th'?'วันที่':'Day'} ${i+1}, ${i+8}, ${i+15}…</small></div>`).join('');
}
function renderBens(){$('bens').innerHTML=BENEFITS.map(b=>`<div class="ben" style="--c:${CATC[b.cat]}"><h3>${tx(b.t)}</h3><p>${tx(b.d)}</p></div>`).join('');}

/* ---------- detail modal ---------- */
let modalMirror=false;
function openDetail(id){const p=POSE[id],c=CATC[p.cat],isThai=THAI_ANIM.has(id);
 $('mFig').dataset.pose=id; $('mFig').dataset.t0=performance.now(); $('mName').textContent=tx(p.name);
 $('mThaiBar').classList.remove('hide'); $('mPhase').textContent=isThai?'':t('cat_'+p.cat);
 $('mMirror').setAttribute('aria-pressed',String(modalMirror));
 $('mLegend').classList.remove('hide');
 const mudras=isThai?THAI_ANIM.get(id).mudras:(id==='wrist'?['tang_wong','jeeb_ngai']:[]);
 $('mMudraWrap').classList.toggle('hide',!mudras.length);
 if(mudras.length){
  const wrap=$('mMudras'); wrap.innerHTML='';
  mudras.forEach(mk=>{const m=THAI_ANIM.MUDRA_INFO[mk];if(!m)return;
   const row=document.createElement('div');row.className='mudra';
   const mc=document.createElement('canvas');row.appendChild(mc);
   const txt=document.createElement('div');txt.innerHTML=`<b>${m.th}</b><small>${m.en}</small>`;row.appendChild(txt);
   wrap.appendChild(row); THAI_ANIM.drawMudraIcon(mc,mk);});
 }
 $('mChips').innerHTML=`<span class="chip" style="--c:${c}">${t('cat_'+p.cat)}</span><span class="chip soft" style="--c:${c}">${t('mode_'+p.mode)}</span>`;
 $('mSteps').innerHTML=tx(p.steps).map(s=>`<li>${s}</li>`).join('');
 $('mMus').innerHTML=tx(p.mus).map(m=>`<span class="chip soft" style="--c:${c}">${m}</span>`).join('');
 $('mBen').textContent=tx(p.ben);
 const ph=(typeof PHOTOS!=='undefined')&&PHOTOS[id]; $('mPhotoWrap').classList.toggle('hide',!ph);
 $('mPhotos').innerHTML=ph?ph.map((src,i)=>`<figure><img src="${src}" alt="${tx(p.name)} · ${t('stepN',{n:i+1})}"><figcaption>${t('stepN',{n:i+1})}</figcaption></figure>`).join(''):'';
 $('modal').classList.remove('hide'); $('mClose').focus();}
function closeDetail(){$('modal').classList.add('hide');}

/* ---------- animation loop for demo figures ---------- */
function anim(ts){requestAnimationFrame(anim);
 for(const cv of document.querySelectorAll('canvas[data-pose]')){if(!cv.offsetParent&&cv.id!=='ovDemo')continue;if(cv.classList.contains('hide'))continue;
  const id=cv.dataset.pose; if(!id) continue;
  const isModal=cv.id==='mFig',isCoach=cv.id==='demo'||cv.id==='ovDemo',t0=+(cv.dataset.t0||0);
  if(id.startsWith('mv:')){FIG.draw(cv,[MOVES[id.slice(3)]],1,0,{chair:true,compact:true,mirror:gameMirror,lang});continue;}
  if(THAI_ANIM.has(id)){
   const s=THAI_ANIM.draw(cv,id,ts-t0,{slow:TIERS[tk()].slow,compact:!(isModal||isCoach),showGuides:isModal||isCoach,mirror:isModal?modalMirror:(isCoach?gameMirror:false),lang});
   if(isModal&&s&&$('mPhase').textContent!==s.phaseText)$('mPhase').textContent=s.phaseText;
   if(cv.id==='demo'&&s&&$('coachPhase')&&$('coachPhase').textContent!==s.phaseText)$('coachPhase').textContent=s.phaseText;
   continue;
  }
  const p=POSE[id]; if(!p) continue;
  FIG.draw(cv,p.keys,(p.ap||3)*TIERS[tk()].slow,ts-t0,{chair:p.chair,compact:!(isModal||isCoach),showGuides:isModal||isCoach,mirror:isModal?modalMirror:(isCoach?gameMirror:false),lang,id});}}
requestAnimationFrame(anim);
/* real-photo cycling, in step with the animated coach */
function photoTick(ts){requestAnimationFrame(photoTick);if(typeof PHOTOS==='undefined')return;
 for(const im of document.querySelectorAll('img[data-ph]')){if(!im.offsetParent||im.classList.contains('hide'))continue;const id=im.dataset.ph,list=PHOTOS[id],p=POSE[id];if(!list||!p)continue;
  const per=(p.ap||3)*TIERS[tk()].slow*1000/list.length,i=Math.floor(Math.max(0,ts-(+(im.dataset.t0||0)))/per)%list.length;if(im.dataset.i!==String(i)){im.dataset.i=i;im.src=list[i];}}}
requestAnimationFrame(photoTick);
function setPhoto(el,id){const has=typeof PHOTOS!=='undefined'&&id&&PHOTOS[id];el.classList.toggle('hide',!has);if(has){if(el.dataset.ph!==id){el.dataset.ph=id;el.dataset.t0=performance.now();el.dataset.i='';el.src=PHOTOS[id][0];el.alt=tx(POSE[id].name);}}else{delete el.dataset.ph;}}

/* ---------- audio ---------- */
function beep(f=880,ms=120){if(!soundOn||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+ms/1000);}catch(e){}}
function say(text){if(!soundOn||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='th'?'th-TH':'en-US';
 const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang));if(v)u.voice=v;u.rate=TIERS[tk()].rate;speechSynthesis.speak(u);}catch(e){}}

/* ---------- geometry / features ---------- */
let AR=16/9;
const deg=r=>r*180/Math.PI, n90=a=>a>90?a-180:a<-90?a+180:a;
function ang(a,b,c){const x1=a.x-b.x,y1=a.y-b.y,x2=c.x-b.x,y2=c.y-b.y;const d=(x1*x2+y1*y2)/((Math.hypot(x1,y1)*Math.hypot(x2,y2))||1e-6);return deg(Math.acos(Math.max(-1,Math.min(1,d))));}
function feats(lm){
 const p=i=>({x:lm[i].x*AR,y:lm[i].y,z:(lm[i].z||0)*AR,v:lm[i].visibility??1});
 const n=p(0),lear=p(7),rear=p(8),ls=p(11),rs=p(12),le=p(13),re=p(14),lw=p(15),rw=p(16),lh=p(23),rh=p(24),lk=p(25),rk=p(26),la=p(27),ra=p(28);
 const sh={x:(ls.x+rs.x)/2,y:(ls.y+rs.y)/2},hp={x:(lh.x+rh.x)/2,y:(lh.y+rh.y)/2},sw=Math.hypot(ls.x-rs.x,ls.y-rs.y)||1e-3,T=Math.max(hp.y-sh.y,.02);
 return {n,ls,rs,lw,rw,lk,rk,la,ra,sh,hp,sw,T,
  tilt:n90(deg(Math.atan2(ls.y-rs.y,ls.x-rs.x))), earTilt:n90(deg(Math.atan2(lear.y-rear.y,lear.x-rear.x))),
  lean:deg(Math.atan2(sh.x-hp.x,hp.y-sh.y)), twist:n90(deg(Math.atan2(ls.z-rs.z,ls.x-rs.x))),
  elL:ang(ls,le,lw), elR:ang(rs,re,rw), kneeDiff:(rk.y-lk.y)/T, seatR:((lk.y+rk.y)/2-hp.y)/T,
  ankL:(la.y-lk.y)/T, ankR:(ra.y-rk.y)/T, ankDiff:(ra.y-la.y)/T, ankDist:Math.abs(la.x-ra.x), kneeDist:Math.abs(lk.x-rk.x), headOff:(n.x-sh.x)/sw,
  vUpper:Math.min(ls.v,rs.v,lh.v,rh.v), vLegs:Math.min(lk.v,rk.v), vFeet:Math.min(la.v,ra.v)};
}
const visible=(f,need)=>f.vUpper>.5&&(need==='upper'||f.vLegs>.5)&&(need!=='feet'||f.vFeet>.5);

 try{landmarker=await PoseLandmarker.createFromOptions(fs,o('GPU'));}catch(e){landmarker=await PoseLandmarker.createFromOptions(fs,o('CPU'));}}
const video=$('vid'),cv=$('cv'),ctx=cv.getContext('2d');

 video.srcObject=stream;await video.play();cv.width=video.videoWidth;cv.height=video.videoHeight;AR=cv.width/cv.height;$('stage').style.aspectRatio=`${cv.width}/${cv.height}`;}
